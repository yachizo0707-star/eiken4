<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英検4級対策</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2A4A;
  --ink-soft:#55647C;
  --paper:#EEF2F5;
  --paper-line:#D7E0E8;
  --card:#FFFFFF;
  --accent:#E4572E;
  --accent-dim:#F7DAD0;
  --good:#2F9E68;
  --good-dim:#D9F0E4;
  --bad:#D64545;
  --bad-dim:#FBDCDC;
  --gold:#F4C744;
  --radius:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
body{
  margin:0;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 27px, var(--paper-line) 27px, var(--paper-line) 28px),
    var(--paper);
  color:var(--ink);
  font-family:'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
  font-size:16px;
  line-height:1.6;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  min-height:100%;
  padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
}
button, input, select{
  font-family:inherit;
  font-size:16px;
  -webkit-appearance:none;
  appearance:none;
}
h1,h2,h3,.font-display{font-family:'Kosugi Maru', 'Zen Kaku Gothic New', sans-serif;}
.wrap{max-width:640px;margin:0 auto;padding:0 16px;}

/* ---------- ticket header ---------- */
.ticket-header{
  background:var(--ink);
  color:#fff;
  padding-top:calc(18px + env(safe-area-inset-top,0px));
  padding-bottom:18px;
  position:relative;
  margin-bottom:22px;
}
.ticket-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.ticket-header .brand{display:flex;align-items:baseline;gap:8px;}
.ticket-header .brand .kanji{font-family:'Kosugi Maru',sans-serif;font-size:20px;letter-spacing:.02em;}
.ticket-header .brand .en{font-size:11px;color:#AEBBD6;letter-spacing:.08em;}
.ticket-header .stamp{
  font-size:12px;color:#0F1B33;background:var(--gold);
  border-radius:999px;padding:5px 12px;font-weight:700;white-space:nowrap;
}
.ticket-header::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:10px;
  background-image:radial-gradient(circle at 8px 0, transparent 7px, var(--paper) 7.5px);
  background-size:16px 10px;background-repeat:repeat-x;
}

/* ---------- section cards ---------- */
.section-title{
  font-size:15px;font-weight:700;color:var(--ink-soft);
  margin:28px 0 10px;padding-left:2px;
  display:flex;align-items:center;gap:8px;
}
.section-title .bar{width:5px;height:16px;background:var(--accent);border-radius:2px;display:inline-block;}

.card{
  background:var(--card);
  border:1px solid var(--paper-line);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
}

.exam-card{
  display:block;width:100%;text-align:left;
  background:var(--card);
  border:1px solid var(--paper-line);
  border-left:5px solid var(--accent);
  border-radius:var(--radius);
  padding:14px 16px;margin-bottom:10px;
  cursor:pointer;
}
.exam-card .row1{display:flex;justify-content:space-between;align-items:center;}
.exam-card .label{font-weight:700;font-size:16px;}
.exam-card .date{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.exam-card .go{font-size:13px;color:var(--accent);font-weight:700;}
.exam-card.pred{border-left-color:var(--gold);}
.exam-card.pred .go{color:#B98A00;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;
  min-height:44px;
}
.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--paper-line);}
.btn.block{display:flex;width:100%;}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.4;}

.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.pill{
  border:1px solid var(--paper-line);background:#fff;border-radius:999px;
  padding:9px 14px;font-size:13px;cursor:pointer;color:var(--ink-soft);
}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink);}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-box{background:#fff;border:1px solid var(--paper-line);border-radius:12px;padding:12px;}
.stat-box .big{font-size:22px;font-weight:900;font-family:'Kosugi Maru';}
.stat-box .lbl{font-size:12px;color:var(--ink-soft);}
.bar-track{background:var(--paper);border-radius:999px;height:8px;overflow:hidden;margin-top:6px;}
.bar-fill{height:100%;background:var(--accent);border-radius:999px;}

/* ---------- quiz screen ---------- */
.quiz-topbar{
  position:sticky;top:0;z-index:5;
  background:var(--paper);
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-bottom:8px;
}
.progress-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft);}
.progress-track{flex:1;height:6px;background:#fff;border:1px solid var(--paper-line);border-radius:999px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);}
.quit-btn{background:none;border:none;color:var(--ink-soft);font-size:13px;padding:4px 8px;cursor:pointer;}

.q-tag{
  display:inline-block;font-size:11px;font-weight:700;color:#fff;
  background:var(--ink-soft);border-radius:6px;padding:3px 8px;margin-bottom:10px;
}
.q-text{font-size:16px;white-space:pre-line;margin-bottom:14px;}
.passage-box{
  background:var(--paper);border:1px solid var(--paper-line);border-radius:12px;
  padding:14px;margin-bottom:14px;font-size:14.5px;white-space:pre-line;
}
.passage-box h4{margin:0 0 8px;font-size:15px;}
.email-box{border-bottom:1px dashed var(--paper-line);padding-bottom:10px;margin-bottom:10px;}
.email-box:last-child{border-bottom:none;margin-bottom:0;}
.email-meta{font-size:12px;color:var(--ink-soft);margin-bottom:4px;}

.choice{
  display:flex;align-items:center;gap:10px;
  width:100%;text-align:left;background:#fff;
  border:1.5px solid var(--paper-line);border-radius:12px;
  padding:13px 14px;margin-bottom:9px;font-size:15px;cursor:pointer;
  min-height:44px;
}
.choice .num{
  width:24px;height:24px;border-radius:50%;background:var(--paper);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  flex-shrink:0;color:var(--ink-soft);
}
.choice.correct{background:var(--good-dim);border-color:var(--good);}
.choice.correct .num{background:var(--good);color:#fff;}
.choice.incorrect{background:var(--bad-dim);border-color:var(--bad);}
.choice.incorrect .num{background:var(--bad);color:#fff;}
.choice:disabled{cursor:default;}
.choice.dim{opacity:.55;}

.listen-box{
  background:var(--ink);color:#fff;border-radius:14px;padding:18px;margin-bottom:16px;
  display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
}
.listen-btn{
  width:64px;height:64px;border-radius:50%;background:var(--gold);border:none;
  font-size:26px;cursor:pointer;color:#1B2A4A;
}
.listen-hint{font-size:12px;color:#AEBBD6;}
.script-reveal{
  margin-top:10px;font-size:13px;background:rgba(255,255,255,.08);
  border-radius:8px;padding:10px;text-align:left;white-space:pre-line;
}

.explain-box{
  margin-top:14px;background:var(--paper);border-radius:12px;padding:14px;font-size:14px;
}
.explain-box .head{font-weight:700;margin-bottom:6px;}

.footer-nav{position:sticky;bottom:0;background:var(--paper);padding:10px 0 4px;margin-top:8px;}

/* ---------- results ---------- */
.score-hero{
  text-align:center;padding:26px 10px;background:var(--ink);color:#fff;
  border-radius:16px;margin-bottom:18px;
}
.score-hero .num{font-family:'Kosugi Maru';font-size:46px;font-weight:700;}
.score-hero .sub{font-size:13px;color:#AEBBD6;margin-top:4px;}
.review-row{
  display:flex;justify-content:space-between;gap:10px;padding:12px 0;
  border-bottom:1px solid var(--paper-line);font-size:14px;
}
.review-row:last-child{border-bottom:none;}
.review-row .ok{color:var(--good);font-weight:700;}
.review-row .ng{color:var(--bad);font-weight:700;}

.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;background:var(--paper);color:var(--ink-soft);margin-left:6px;}
.empty-note{color:var(--ink-soft);font-size:13.5px;padding:18px 4px;text-align:center;}
.hidden{display:none !important;}
a{color:var(--accent);}
</style>
</head>

fore class tomorrow."], "question": "What do they need to do by Friday?", "choices": ["Take a test.", "Talk to their history teacher.", "Clean their classroom.", "Finish their reports."], "a": 3}, {"n": 16, "script": ["You can pick one toy from here.", "I want a toy car.", "You already have one.  How about another toy?", "No, I like cars."], "question": "Which toy does the boy want?", "choices": ["A toy dog.", "A robot.", "A toy car.", "A toy plane."], "a": 2}, {"n": 17, "script": ["You have a baseball game today, right?", "Yes.  I also have a soccer game on Wednesday.", "Is your tennis game on Friday?", "That's right."], "question": "Which game does the girl have today?", "choices": ["A tennis game.", "A soccer game.", "A basketball game.", "A baseball game."], "a": 3}, {"n": 18, "script": ["You have a dog, right, Mia?", "Yes, I do.", "What other pets do you have?", "A cat and a bird.  So I have three pets."], "question": "How many pets does Mia have?", "choices": ["One.", "Two.", "Three.", "Four."], "a": 2}, {"n": 19, "script": ["Can we go to a Japanese restaurant for dinner?", "No, I had Japanese food for lunch.", "Where should we go?", "Let's go to an Italian restaurant."], "question": "Where will they go for dinner?", "choices": ["To a Chinese restaurant.", "To a Japanese restaurant.", "To a Spanish restaurant.", "To an Italian restaurant."], "a": 3}, {"n": 20, "script": ["Can we study together today?", "I can't.  I have a meeting at the library.", "How about tomorrow?  We can meet at school.", "OK.  Let's meet at two."], "question": "Where will they meet tomorrow?", "choices": ["At school.", "At the girl's house.", "At the library.", "At the boy's house."], "a": 0}], "part3": [{"n": 21, "script": ["Emma enjoys shopping.  This weekend she will go to the new shopping center with her friend.  She is going to buy a birthday present for her mother."], "question": "What will Emma do this weekend?", "choices": ["Visit her friend.", "Go shopping.", "Go to a party.", "Make a cake."], "a": 1}, {"n": 22, "script": ["My parents and I went to my favorite curry restaurant last night.  It's near our house.  The vegetable curry is really good."], "question": "What is the girl talking about?", "choices": ["Her vegetable garden.", "A cooking class.", "A restaurant.", "Her new house."], "a": 2}, {"n": 23, "script": ["Kathy and Mary play tennis together on Saturday mornings.  Today, it rained, so they went to a shopping mall.  They bought some books there."], "question": "What did Kathy and Mary do today?", "choices": ["They played tennis.", "They saw a movie.", "They went shopping.", "They went to the library."], "a": 2}, {"n": 24, "script": ["After school, I often go to my friend Andrew's house, and we study together.  Sometimes we play computer games, too.  Andrew has lots of great games."], "question": "Where does the boy often go after school?", "choices": ["To the library.", "To a big game.", "To the computer club.", "To his friend's house."], "a": 3}, {"n": 25, "script": ["Wendy had a party at her house yesterday.  She made pasta, and her husband made vegetable soup.  Her friend Julie brought drinks and cake."], "question": "Who made vegetable soup?", "choices": ["Wendy.", "Wendy's husband.", "Julie.", "Julie's husband."], "a": 1}, {"n": 26, "script": ["Emi likes reading.  She often goes to the library.  Today, she will read a book at home after school."], "question": "What will Emi do today?", "choices": ["Go to the library.", "Help her mother.", "Call her friend.", "Read a book at home."], "a": 3}, {"n": 27, "script": ["Jack usually plays soccer or rides his bike with his friends after school.  But it rained yesterday, so he stayed at home and read books in the afternoon."], "question": "What did Jack do yesterday afternoon?", "choices": ["He read books.", "He rode his bike.", "He played soccer.", "He did his homework."], "a": 0}, {"n": 28, "script": ["Yesterday, my father made lunch for Anna and me.  My mother and brother were not eah, I slept well last night.", "Yeah, we can do it together.", "Yeah, I need to go to bed now."], "a": 3}, {"n": 20, "q": "Brother: I can't finish my homework.  It's too difficult.\nSister: ( )  I can help you.\nBrother: Thanks.", "choices": ["Take care.", "Nice talking to you.", "It's ready.", "Don't worry."], "a": 3}], "part3": [{"n": 21, "jp": "あなたの電話番号を教えていただけますか。", "words": ["number", "may", "your telephone", "I", "have"], "template": "__ __ __ __, please?", "combos": [[3, 2], [1, 2], [4, 0], [2, 0]], "a": 0, "full": "May I have your telephone number, please?"}, {"n": 22, "jp": "キャロルは昨日7時に家を出て学校へ向かいました。", "words": ["at", "left", "her house", "school", "for"], "template": "Carol __ __ __ __ seven yesterday.", "combos": [[4, 2], [4, 0], [2, 3], [2, 0]], "a": 2, "full": "Carol left her house for school at seven yesterday."}, {"n": 23, "jp": "ポールは今日遅く起きたので、朝食を食べる時間がありませんでした。", "words": ["have", "didn't", "breakfast", "for", "time"], "template": "Paul __ __ __ __ because he got up late today.", "combos": [[3, 4], [4, 2], [2, 1], [0, 3]], "a": 3, "full": "Paul didn't have time for breakfast because he got up late today."}, {"n": 24, "jp": "私は、数学のテストについてブラウン先生と放課後に話します。", "words": ["the math test", "about", "will", "talk", "with"], "template": "I __ __ __ __ Mr. Brown after school.", "combos": [[4, 0], [3, 0], [0, 1], [3, 0]], "a": 3, "full": "I will talk about the math test with Mr. Brown after school."}, {"n": 25, "jp": "私は新しいCDを何回も聞きました。", "words": ["my new CD", "and", "to", "again", "listened"], "template": "I __ __ __ __ again.", "combos": [[1, 2], [1, 3], [3, 2], [4, 3]], "a": 1, "full": "I listened to my new CD again and again."}], "part4A": {"title": "Today's Special at West Juice Shop", "passage": "Grape juice is today's special!\nA glass of grape juice is only $2.\n\nA glass of melon, orange, or peach juice is $5.\n\nFresh fruits for juice come from the farm at 6:00 a.m. every day.\n\nWe are open in the morning from 7:00 a.m. to 11:00 a.m.", "questions": [{"n": 26, "q": "What is today's special juice?", "choices": ["Melon juice.", "Orange juice.", "Grape juice.", "Peach juice."], "a": 2}, {"n": 27, "q": "What time do the fresh fruits come from the farm every day?", "choices": ["At 5:00 a.m.", "At 6:00 a.m.", "At 7:00 a.m.", "At 11:00 a.m."], "a": 1}]}, "part4B": {"title": "It's too cold!", "emails": [{"from": "Emily Hill", "to": "Tina Hill", "date": "December 12", "subject": "It's too cold!", "body": "Hi Mom,\nI just got to Grandma's house.  I couldn't take a bus because there were too many people near the bank's bus stop, so I came here on foot.  Will you come here later?  It's cold and snowy outside.  I wore my sweater and coat and brought an umbrella, but I left my gloves at home.  Can you bring them?\nWrite back soon,\nEmily"}, {"from": "Tina Hill", "to": "Emily Hill", "date": "December 12", "subject": "Yes!", "body": "Hi Emily,\nOK, I'll take your gloves later.  I just got home by train from my office, and yes, it's very cold outside!  At five o'clock, I'll go to the supermarket to buy some chocolate for your grandma.  After that, I'll go to her house by taxi!\nSee you later,\nMom"}], "questions": [{"n": 28, "q": "How did Emily get to her grandmother's house?", "choices": ["On foot.", "By train.", "By bus.", "By taxi."], "a": 0}, {"n": 29, "q": "What did Emily leave at home?", "choices": ["Her sweater.", "Her coat.", "Her gloves.", "Her umbrella."], "a": 2}, {"n": 30, "q": "Where will Emily's mother go at five o'clock?", "choices": ["To the bank.", "To the supermarket.", "To her office.", "To the train station."], "a": 1}]}, "part4C": {"title": "A Friend in Canada", "passage": "Yuki is thirteen years old.  She lives in Osaka.  She has a friend in Canada.  Her friend's name is Paul, and he is fourteen years old.\n\nLast winter, Yuki and her family visited Paul and his parents in Canada for twelve days.  On the first day, Paul showed Yuki and her family around Vancouver.  The next day, they all went to a mountain.\n\nOne day during lunch, Paul asked Yuki, \"Is summer the best season in Japan?\"  Yuki answered, \"No, I like spring because the cherry blossoms are beautiful.\"  Paul is interested in Japanese temples, so he wants to go to Kyoto someday.\n\nOn the last day of the trip, Paul and Yuki looked sad.  When they said goodbye, Paul's mother said, \"See you in Osaka next spring.\"  Yuki's father said, \"Yes.  Please stay with us for a few days.\"  Yuki and Paul were very happy.  Yuki is looking forward to seeing Paul again.", "questions": [{"n": 31, "q": "How old is Paul?", "choices": ["Twelve years old.", "Thirteen years old.", "Fourteen years old.", "Fifteen years old."], "a": 2}, {"n": 32, "q": "When did Yuki and her family visit Canada?", "choices": ["In the spring.", "In the summer.", "In the fall.", "In the winter."], "a": 3}, {"n": 33, "q": "What did Yuki say to Paul about spring in Japan?", "choices": ["The food is not good.", "The temples are crowded.", "The cherry blossoms are beautiful.", "The mountains are dangerous."], "a": 2}, {"n": 34, "q": "Paul wants to go to Kyoto because", "choices": ["he is interested in Japanese temples.", "he loves Japanese food.", "his grandparents live there.", "his Japanese teacher is from there."], "a": 0}, {"n": 35, "q": "What is Yuki looking forward to?", "choices": ["Visiting a different country.", "Seeing Paul again.", "Making dinner with Paul's mother.", "Studying English in Canada."], "a": 1}]}}, "listening": {"audio": {"part1": "https://media.eiken.or.jp/listening/grade_4/2025-30/4Q-part1.mp3", "part2": "https://media.eiken.or.jp/listening/grade_4/2025-30/4Q-part2.mp3", "part3": "https://media.eiken.or.jp/listening/grade_4/2025-30/4Q-part3.mp3"}, "part1": [{"n": 1, "script": ["Do you still live on Birch Street?", "No, I moved to Oak Street.", "How is your new house?"], "choices": ["I know that place.", "You can do it.", "I really like it."], "a": 2}, {"n": 2, "script": ["Lisa?", "What is it, Mike?", "Did you see my blue pen orrow.", "This weekend.", "Next month.", "Next winter."], "a": 0}, {"n": 13, "script": ["Did you bring my book?", "Sorry.  I left it in my bedroom.", "That's OK.  Did you finish reading it?", "Yes.  It was great."], "question": "What are they talking about?", "choices": ["Their favorite movie.", "The boy's book.", "The girl's bedroom.", "The library."], "a": 3}, {"n": 14, "script": ["Ted, when will you leave for Europe?", "Tomorrow.  I'll stay in France for one week and Spain for five days.", "Have fun.", "Thanks.  See you next month."], "question": "How long will Ted stay in Spain?", "choices": ["For one day.", "For five days.", "For one week.", "For five weeks."], "a": 1}, {"n": 15, "script": ["How's your new school?", "My teachers are nice, and the gym is new.", "What do you like the best?", "The cafeteria.  It's big."], "question": "What does the girl like the best about her new school?", "choices": ["The cafeteria.", "The gym.", "Her teachers.", "Her friends."], "a": 0}, {"n": 16, "script": ["Can you help me with the math homework?", "Sorry, I'm doing my science homework.", "I'll ask the teacher for help.", "OK."], "question": "What does the girl need help with?", "choices": ["The science homework.", "The English homework.", "The history homework.", "The math homework."], "a": 0}, {"n": 17, "script": ["Dad, what's for lunch?", "We can have sandwiches or noodles.", "I had toast for breakfast.  I don't want sandwiches.", "OK, we'll have noodles."], "question": "What did the girl have for breakfast?", "choices": ["Sandwiches.", "Toast.", "Soup.", "Noodles."], "a": 1}, {"n": 18, "script": ["Is the class trip next month?", "No.  It's next Friday.", "What time will it start?", "At 9:00 a.m.  We'll go to the zoo."], "question": "When is the class trip?", "choices": ["Next Friday.", "Next Saturday.", "Next month.", "Next Sunday."], "a": 3}, {"n": 19, "script": ["I bought you a present.", "Thank you, Oliver!  Are they socks?", "No.  I bought black gloves for you.", "How <script id="app-js">(function(){
"use strict";

var EXAMS = window.EXAM_DATA.exams; // [examA, examB, examC, examD]
var EXAM_MAP = {};
EXAMS.forEach(function(e){ EXAM_MAP[e.id] = e; });

var R_LABELS = {
  part1:"大問1・単語と熟語", part2:"大問2・会話文の完成", part3:"大問3・語句整序",
  part4A:"大問4A・掲示/メモ", part4B:"大問4B・Eメール", part4C:"大問4C・物語文"
};
var L_LABELS = { part1:"リスニング第1部", part2:"リスニング第2部", part3:"リスニング第3部" };
var SEC_SHORT = { R1:"大問1", R2:"大問2", R3:"大問3", R4A:"大問4A", R4B:"大問4B", R4C:"大問4C", L1:"L第1部", L2:"L第2部", L3:"L第3部" };
var ALL_SECTION_KEYS = ["R1","R2","R3","R4A","R4B","R4C","L1","L2","L3"];

function secKeyOf(domain, part){
  var p = part.replace("part","");
  return (domain==="reading"?"R":"L") + p;
}
function labelOf(domain, part){
  return domain==="reading" ? R_LABELS[part] : L_LABELS[part];
}

/* ---------------- storage ---------------- */
var STORE_STATS = "eiken4_stats_v1";
var STORE_WRONG = "eiken4_wrong_v1";

function loadStats(){
  try{ return JSON.parse(localStorage.getItem(STORE_STATS)) || {}; }catch(e){ return {}; }
}
function saveStats(s){
  try{ localStorage.setItem(STORE_STATS, JSON.stringify(s)); }catch(e){}
}
function loadWrong(){
  try{ return JSON.parse(localStorage.getItem(STORE_WRONG)) || []; }catch(e){ return []; }
}
function saveWrong(w){
  try{ localStorage.setItem(STORE_WRONG, JSON.stringify(w)); }catch(e){}
}
function recordResult(q, isCorrect, yourText, correctText){
  var stats = loadStats();
  var sk = q.sectionKey;
  if(!stats[sk]) stats[sk] = {attempts:0, correct:0};
  stats[sk].attempts++;
  if(isCorrect) stats[sk].correct++;
  saveStats(stats);

  var wrong = loadWrong();
  var idx = -1;
  for(var i=0;i<wrong.length;i++){ if(wrong[i].key===q.key){ idx=i; break; } }
  if(isCorrect){
    if(idx>=0) wrong.splice(idx,1);
  } else {
    var entry = {
      key:q.key, examId:q.examId, examLabel:q.examLabel, sectionKey:sk,
      sectionLabel:q.sectionLabel, n:q.n, promptShort:q.promptShort,
      correctText:correctText, yourText:yourText, ts:Date.now()
    };
    if(idx>=0) wrong[idx]=entry; else wrong.unshift(entry);
    if(wrong.length>300) wrong.length=300;
  }
  saveWrong(wrong);
}

/* ---------------- helpers ---------------- */
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function esc(s){
  return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ---------------- build question pool ---------------- */
// returns array of "blocks"; each block is {kind:'single', q:...} or {kind:'group', items:[q,...]}
function buildBlocks(examIds, sectionKeys){
  var blocks = [];
  examIds.forEach(function(examId){
    var exam = EXAM_MAP[examId];
    if(!exam) return;
    sectionKeys.forEach(function(sk){
      if(sk[0]==="R"){
        var part = "part" + sk.slice(1);
        if(part==="part1" || part==="part2"){
          (exam.reading[part]||[]).forEach(function(item){
            blocks.push({kind:"single", q:{
              key: exam.id+"_"+sk+"_"+item.n, examId:exam.id, examLabel:exam.label,
              domain:"reading", section:part, sectionKey:sk, sectionLabel:labelOf("reading",part),
              type:"choice", n:item.n, q:item.q, choices:item.choices, a:item.a,
              promptShort: item.q.replace(/\n/g," / ").slice(0,40)
            }});
          });
        } else if(part==="part3"){
          (exam.reading.part3||[]).forEach(function(item){
            blocks.push({kind:"single", q:{
              key: exam.id+"_"+sk+"_"+item.n, examId:exam.id, examLabel:exam.label,
              domain:"reading", section:part, sectionKey:sk, sectionLabel:labelOf("reading",part),
              type:"order", n:item.n, jp:item.jp, words:item.words, template:item.template,
              combos:item.combos, a:item.a, full:item.full,
              promptShort: item.jp.slice(0,40)
            }});
          });
        } else {
          // part4A / part4B / part4C
          var g = exam.reading[part];
          if(!g) return;
          var items = g.questions.map(function(item){
            return {
              key: exam.id+"_"+sk+"_"+item.n, examId:exam.id, examLabel:exam.label,
              domain:"reading", section:part, sectionKey:sk, sectionLabel:labelOf("reading",part),
              type:"passage", n:item.n, q:item.q, choices:item.choices, a:item.a,
              title:g.title, passage:g.passage, emails:g.emails,
              promptShort: item.q.slice(0,40)
            };
          });
          blocks.push({kind:"group", items:items});
        }
      } else {
        var lpart = "part" + sk.slice(1);
        (exam.listening[lpart]||[]).forEach(function(item){
          blocks.push({kind:"single", q:{
            key: exam.id+"_"+sk+"_"+item.n, examId:exam.id, examLabel:exam.label,
            domain:"listening", section:lpart, sectionKey:sk, sectionLabel:labelOf("listening",lpart),
            type:"listen", n:item.n, script:item.script, question:item.question||null,
            choices:item.choices, a:item.a,
            promptShort: (item.question || item.script[item.script.length-1] || "").slice(0,40)
          }});
        });
      }
    });
  });
  return blocks;
}
function flattenBlocks(blocks){
  var list = [];
  blocks.forEach(function(b){
    if(b.kind==="single"){ list.push(b.q); }
    else {
      b.items.forEach(function(it,i){
        it.groupIndex = i; it.groupTotal = b.items.length;
        list.push(it);
      });
    }
  });
  return list;
}

function renderHome(){

  var wrong = loadWrong();
  var totalAttempts=0, totalCorrect=0;
  ALL_SECTION_KEYS.forEach(function(k){ if(stats[k]){ totalAttempts+=stats[k].attempts; totalCorrect+=stats[k].correct; }});
  var acc = totalAttempts? Math.round(totalCorrect/totalAttempts*100) : null;

  var html = "";
  html += '<div class="stat-grid" style="margin-top:4px;">';
  html += '<div class="stat-box"><div class="big">'+(acc==null?"--":acc+"%")+'</div><div class="lbl">全体正答率</div></div>';
  html += '<div class="stat-box"><div class="big">'+wrong.length+'</div><div class="lbl">間違いノートの件数</div></div>';
  html += '</div>';

  html += '<div class="section-title"><span class="bar"></span>本番形式で解く</div>';
  EXAMS.forEach(function(exam){
    var predClass = exam.id==="pred-1" ? " pred" : "";
    html += '<button class="exam-card'+predClass+'" data-full="'+exam.id+'">'+
      '<div class="row1"><div><div class="label">'+esc(exam.label)+'</div>'+
      '<div class="date">'+esc(exam.dateStr)+' ・ 筆記35問+リスニング30問</div></div>'+
      '<div class="go">解く ›</div></div></button>';
  });

  html += '<div class="section-title"><span class="bar"></span>大問別に練習する</div>';
  html += '<div class="card">教科書ワークのように、苦手な大問だけを選んで解けます。</div>';
  html += '<button class="btn block secondary" id="goPicker">大問と回を選ぶ</button>';

  html += '<div class="section-title"><span class="bar"></span>復習</div>';
  html += '<button class="btn block secondary" id="goReview" '+(wrong.length? "":"disabled")+'>間違いノートを復習する（'+wrong.length+'問）</button>';
  html += '<div style="height:10px"></div>';
  html += '<button class="btn block secondary" id="goStats">学習状況を見る</button>';

  app.innerHTML = html;

  Array.prototype.forEach.call(app.querySelectorAll("[data-full]"), function(btn){
    btn.addEventListener("click", function(){
      var examId = btn.getAttribute("data-full");
      startFullMock(examId);
    });
  });
  document.getElementById("goPicker").addEventListener("click", function(){ go(renderPicker); });
  document.getElementById("goStats").addEventListener("click", function(){ go(renderStats); });
  var rb = document.getElementById("goReview");
  if(!rb.disabled) rb.addEventListener("click", function(){ startReview(); });
}

/* ---------------- PICKER (大問別演習) ---------------- */
var pickerState = { exams: EXAMS.map(function(e){return e.id;}), sections: ["R1"] };

function renderPicker(){
  headerStamp.textContent = "大問選択";
  var html = "";
  html += '<div class="section-title"><span class="bar"></span>対象の回</div>';
  html += '<div class="pill-row" id="examPills">';
  EXAMS.forEach(function(e){
    var on = pickerState.exams.indexOf(e.id)>=0;
    html += '<span class="pill'+(on?" on":"")+'" data-exam="'+e.id+'">'+esc(e.label)+'</span>';
  });
  html += '</div>';

  html += '<div class="section-title"><span class="bar"></span>対象の大問（複数選択可）</div>';
  html += '<div class="pill-row" id="secPills">';
  ["R1","R2","R3","R4A","R4B","R4C","L1","L2","L3"].forEach(function(sk){
    var on = pickerState.sections.indexOf(sk)>=0;
    var lbl = sk[0]==="R" ? R_LABELS["part"+sk.slice(1)].replace(/^大問\d[A-C]?・/,"") : L_LABELS["part"+sk.slice(1)];
    html += '<span class="pill'+(on?" on":"")+'" data-sec="'+sk+'">'+SEC_SHORT[sk]+' '+esc(lbl)+'</span>';
  });
  html += '</div>';

  html += '<div style="height:10px"></div>';
  html += '<button class="btn block" id="startPractice">この条件で開始する</button>';
  html += '<div style="height:8px"></div>';
  html += '<button class="btn block secondary" id="backHome">ホームに戻る</button>';

  app.innerHTML = html;

  Array.prototype.forEach.call(app.querySelectorAll("[data-exam]"), function(p){
    p.addEventListener("click", function(){
      var id = p.getAttribute("data-exam");
      var idx = pickerState.exams.indexOf(id);
      if(idx>=0) pickerState.exams.splice(idx,1); else pickerState.exams.push(id);
      go(renderPicker);
    });
  });
  Array.prototype.forEach.call(app.querySelectorAll("[data-sec]"), function(p){
    p.addEventListener("click", function(){
      var sk = p.getAttribute("data-sec");
      var idx = pickerState.sections.indexOf(sk);
      if(idx>=0) pickerState.sections.splice(idx,1); else pickerState.sections.push(sk);
      go(renderPicker);
    });
  });
  document.getElementById("backHome").addEventListener("click", function(){ go(renderHome); });
  document.getElementById("startPractice").addEventListener("click", function(){
    if(!pickerState.exams.length || !pickerState.sections.length){
      alert("回と大問を1つ以上選んでください。");
      return;
    }
    var blocks = buildBlocks(pickerState.exams, pickerState.sections);
    blocks = shuffle(blocks);
    var list = flattenBlocks(blocks);
    if(!list.length){ alert("この条件の問題が見つかりませんでした。"); return; }
    runQuiz(list, "大問別演習", null);
  });
}

/* ---------------- FULL MOCK ---------------- */
function startFullMock(examId){
  var order = ["R1","R2","R3","R4A","R4B","R4C","L1","L2","L3"];
  var blocks = buildBlocks([examId], order);
  var list = flattenBlocks(blocks); // keep official order, no shuffle
  runQuiz(list, EXAM_MAP[examId].label + "（本番形式）", examId);
}

/* ---------------- REVIEW WRONG ---------------- */
function startReview(){
  var wrong = loadWrong();
  if(!wrong.length){ return; }
  var byExam = {};
  wrong.forEach(function(w){ (byExam[w.examId]=byExam[w.examId]||[]).push(w.sectionKey); });
  var list = [];
  Object.keys(byExam).forEach(function(examId){
    var secs = byExam[examId].filter(function(v,i,arr){ return arr.indexOf(v)===i; });
    var blocks = buildBlocks([examId], secs);
    var flat = flattenBlocks(blocks);
    var wrongKeys = wrong.filter(function(w){return w.examId===examId;}).map(function(w){return w.key;});
    flat.forEach(function(q){ if(wrongKeys.indexOf(q.key)>=0) list.push(q); });
  });
  list = shuffle(list);
  runQuiz(list, "間違いノート復習", null);
}

/* ---------------- QUIZ RUNNER ---------------- */
function runQuiz(list, sessionLabel, examId){
  SESSION = { list:list, idx:0, answers:[], label:sessionLabel, examId:examId };
  go(renderQuestion);
}

function currentQ(){ return SESSION.list[SESSION.idx]; }

function renderTopbar(){
  var pct = Math.round((SESSION.idx)/SESSION.list.length*100);
  var html = '<div class="quiz-topbar"><div class="wrap" style="padding:0;">'+
    '<div class="progress-row">'+
    '<button class="quit-btn" id="quitBtn">✕ 中断</button>'+
    '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>'+
    '<span>'+(SESSION.idx+1)+' / '+SESSION.list.length+'</span>'+
    '</div></div></div>';
  return html;
}

function renderQuestion(){
  headerStamp.textContent = SESSION.label.length>10 ? SESSION.label.slice(0,10)+"…" : SESSION.label;
  var q = currentQ();
  var html = renderTopbar();
  html += '<div class="q-tag">'+esc(q.examLabel)+' ・ '+esc(q.sectionLabel)+' No.'+q.n+'</div>';

  if(q.type==="passage" && q.groupIndex===0){
    html += renderPassageBox(q);
  } else if(q.type==="passage"){
    html += renderPassageBox(q, true);
  }

  if(q.type==="passage"){
    html += '<div style="font-size:12px;color:var(--ink-soft);margin-bottom:6px;">設問 '+(q.groupIndex+1)+' / '+q.groupTotal+'</div>';
    html += '<div class="q-text">'+esc(q.q)+'</div>';
    html += renderChoices(q.choices);
  } else if(q.type==="choice"){
    html += '<div class="q-text">'+esc(q.q)+'</div>';
    html += renderChoices(q.choices);
  } else if(q.type==="order"){
    html += '<div class="q-text">'+esc(q.jp)+'</div>';
    html += '<div class="passage-box" style="font-size:16px;text-align:center;letter-spacing:.02em;">'+esc(q.template)+'</div>';
    html += '<div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">使う語句：'+q.words.map(function(w){return esc(w);}).join(" ／ ")+'</div>';
    html += '<div style="font-size:13px;color:var(--ink-soft);margin-bottom:8px;">2番目と4番目にくる語句の正しい組み合わせを選びなさい。</div>';
    var comboLabels = q.combos.map(function(c){ return "2番目: "+q.words[c[0]]+" ／ 4番目: "+q.words[c[1]]; });
    html += renderChoices(comboLabels);
  } else if(q.type==="listen"){
    html += '<div class="listen-box">'+
      '<button class="listen-btn" id="playBtn">🔊</button>'+
      '<div class="listen-hint">タップして音声（合成音声）を再生</div>'+
      '</div>';
    if(q.question){
      html += '<div class="q-text" style="font-weight:700;">'+esc(q.question)+'</div>';
    }
    html += renderChoices(q.choices);
    html += '<div id="scriptReveal"></div>';
  }

  html += '<div id="explainSlot"></div>';
  html += '<div class="footer-nav"><button class="btn block hidden" id="nextBtn">次へ</button></div>';

  app.innerHTML = html;

  document.getElementById("quitBtn").addEventListener("click", function(){
    if(confirm("演習を中断してホームに戻りますか？（ここまでの結果は保存されません）")){
      go(renderHome);
    }
  });

  if(q.type==="listen"){
    document.getElementById("playBtn").addEventListener("click", function(){ speakScript(q); });
  }

  Array.prototype.forEach.call(app.querySelectorAll(".choice"), function(btn){
    btn.addEventListener("click", function(){ onChoose(btn, q); });
  });
}

function renderPassageBox(q, compact){
  var html = '<div class="passage-box">';
  if(!compact) html += '<h4>'+esc(q.title)+'</h4>';
  if(q.emails){
    q.emails.forEach(function(m){
      html += '<div class="email-box"><div class="email-meta">From: '+esc(m.from)+' / To: '+esc(m.to)+' / '+esc(m.date)+'<br>件名: '+esc(m.subject)+'</div>'+esc(m.body)+'</div>';
    });
  } else {
    html += esc(q.passage);
  }
  html += '</div>';
  return html;
}

function renderChoices(choices){
  var html = "";
  var nums = ["1","2","3","4"];
  choices.forEach(function(c,i){
    html += '<button class="choice" data-i="'+i+'"><span class="num">'+nums[i]+'</span><span>'+esc(c)+'</span></button>';
  });
  return html;
}

function speakScript(q){
  if(!("speechSynthesis" in window)){ alert("この端末では音声再生に対応していません。"); return; }
  window.speechSynthesis.cancel();
  var lines = q.script.slice();
  if(q.question) lines = lines.concat([q.question]);
  var i = 0;
  function next(){
    if(i>=lines.length) return;
    var u = new SpeechSynthesisUtterance(lines[i]);
    u.lang = "en-US";
    u.rate = 0.95;
    u.onend = function(){ i++; next(); };
    window.speechSynthesis.speak(u);
  }
  next();
}

function onChoose(btn, q){
  var chosen = parseInt(btn.getAttribute("data-i"),10);
  var correctIdx = q.a;
  var isCorrect = chosen===correctIdx;

  Array.prototype.forEach.call(app.querySelectorAll(".choice"), function(b){
    b.disabled = true;
    var i = parseInt(b.getAttribute("data-i"),10);
    if(i===correctIdx) b.classList.add("correct");
    else if(i===chosen) b.classList.add("incorrect");
    else b.classList.add("dim");
  });

  var choiceTextsSrc = q.type==="order"
    ? q.combos.map(function(c){ return "2番目: "+q.words[c[0]]+" ／ 4番目: "+q.words[c[1]]; })
    : q.choices;
  var yourText = choiceTextsSrc[chosen];
  var correctText = choiceTextsSrc[correctIdx];

  var explain = '<div class="explain-box"><div class="head">'+(isCorrect?"✓ 正解！":"✗ 不正解")+'</div>';
  if(q.type==="order"){
    explain += '<div>正しい文: <strong>'+esc(q.full)+'</strong></div>';
  } else if(!isCorrect){
    explain += '<div>正解: <strong>'+esc(correctText)+'</strong></div>';
  }
  if(q.type==="listen"){
    explain += '<div style="margin-top:8px;"><a href="#" id="showScript">▶ スクリプトを見る</a></div>';
  }
  explain += '</div>';
  document.getElementById("explainSlot").innerHTML = explain;

  if(q.type==="listen"){
    document.getElementById("showScript").addEventListener("click", function(ev){
      ev.preventDefault();
      var lines = q.script.slice();
      if(q.question) lines.push("Q: "+q.question);
      document.getElementById("scriptReveal").innerHTML =
        '<div class="script-reveal" style="background:var(--paper);color:var(--ink);">'+lines.map(esc).join("<br>")+'</div>';
      ev.target.style.display="none";
    });
  }

  recordResult(q, isCorrect, yourText, correctText);
  SESSION.answers.push({key:q.key, isCorrect:isCorrect, q:q, yourText:yourText, correctText:correctText});

  var nextBtn = document.getElementById("nextBtn");
  nextBtn.classList.remove("hidden");
  nextBtn.textContent = (SESSION.idx+1 < SESSION.list.length) ? "次へ" : "結果を見る";
  nextBtn.onclick = function(){
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    SESSION.idx++;
    if(SESSION.idx < SESSION.list.length){ go(renderQuestion); }
    else { go(renderResults); }
  };
  if(typeof nextBtn.scrollIntoView === "function"){
    try{ nextBtn.scrollIntoView({behavior:"smooth", block:"nearest"}); }catch(e){}
  }
}

/* ---------------- RESULTS ---------------- */
function renderResults(){
  headerStamp.textContent = "結果";
  var total = SESSION.answers.length;
  var correct = SESSION.answers.filter(function(a){return a.isCorrect;}).length;
  var pct = total? Math.round(correct/total*100) : 0;

  var html = '<div class="score-hero"><div class="num">'+correct+' / '+total+'</div><div class="sub">正答率 '+pct+'%　・　'+esc(SESSION.label)+'</div></div>';

  var bySec = {};
  SESSION.answers.forEach(function(a){
    var sk = a.q.sectionKey;
    if(!bySec[sk]) bySec[sk] = {c:0,t:0};
    bySec[sk].t++; if(a.isCorrect) bySec[sk].c++;
  });
  html += '<div class="section-title"><span class="bar"></span>大問別の結果</div><div class="card">';
  Object.keys(bySec).forEach(function(sk){
    var b = bySec[sk];
    var p = Math.round(b.c/b.t*100);
    html += '<div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:13.5px;"><span>'+SEC_SHORT[sk]+'</span><span>'+b.c+'/'+b.t+'</span></div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+p+'%"></div></div></div>';
  });
  html += '</div>';

  var wrongs = SESSION.answers.filter(function(a){return !a.isCorrect;});
  html += '<div class="section-title"><span class="bar"></span>間違えた問題（'+wrongs.length+'問）</div>';
  if(!wrongs.length){
    html += '<div class="empty-note">全問正解でした！🎉</div>';
  } else {
    html += '<div class="card">';
    wrongs.forEach(function(a){
      html += '<div class="review-row"><span>'+esc(a.q.sectionLabel)+' No.'+a.q.n+'<br><span style="color:var(--ink-soft);font-size:12px;">'+esc(a.q.promptShort)+'</span></span>'+
        '<span style="text-align:right;"><span class="ng">✗</span> '+esc(a.correctText)+'</span></div>';
    });
    html += '</div>';
  }

  html += '<div style="height:6px"></div>';
  if(wrongs.length){
    html += '<button class="btn block" id="reviewNow">間違えた問題だけもう一度解く</button><div style="height:8px"></div>';
  }
  html += '<button class="btn block secondary" id="backHome2">ホームに戻る</button>';

  app.innerHTML = html;

  document.getElementById("backHome2").addEventListener("click", function(){ go(renderHome); });
  if(wrongs.length){
    document.getElementById("reviewNow").addEventListener("click", function(){
      var list = wrongs.map(function(a){return a.q;});
      runQuiz(list, "誤答の復習", null);
    });
  }
}

/* ---------------- STATS ---------------- */
function renderStats(){
  headerStamp.textContent = "学習状況";
  var stats = loadStats();
  var wrong = loadWrong();

  var html = '<div class="section-title"><span class="bar"></span>大問別 正答率</div><div class="card">';
  ALL_SECTION_KEYS.forEach(function(sk){
    var s = stats[sk];
    var label = sk[0]==="R" ? R_LABELS["part"+sk.slice(1)] : L_LABELS["part"+sk.slice(1)];
    if(!s || !s.attempts){
      html += '<div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-soft);"><span>'+esc(label)+'</span><span>未挑戦</span></div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:0%"></div></div></div>';
    } else {
      var p = Math.round(s.correct/s.attempts*100);
      html += '<div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:13.5px;"><span>'+esc(label)+'</span><span>'+s.correct+'/'+s.attempts+'（'+p+'%）</span></div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+p+'%;background:'+(p<60?"var(--bad)":p<80?"var(--gold)":"var(--good)")+';"></div></div></div>';
    }
  });
  html += '</div>';

  html += '<div class="section-title"><span class="bar"></span>間違いノート（'+wrong.length+'問）</div>';
  if(!wrong.length){
    html += '<div class="empty-note">まだ記録がありません。演習を始めましょう。</div>';
  } else {
    html += '<div class="card">';
    wrong.slice(0,80).forEach(function(w){
      html += '<div class="review-row"><span>'+esc(w.examLabel)+' ・ '+esc(w.sectionLabel)+' No.'+w.n+'<br><span style="color:var(--ink-soft);font-size:12px;">'+esc(w.promptShort)+'</span></span>'+
        '<span style="text-align:right;font-size:13px;">正解: '+esc(w.correctText)+'</span></div>';
    });
    html += '</div>';
  }

  html += '<div style="height:6px"></div>';
  html += '<button class="btn block secondary" id="resetStats">記録をすべてリセットする</button>';
  html += '<div style="height:8px"></div>';
  html += '<button class="btn block secondary" id="backHome3">ホームに戻る</button>';

  app.innerHTML = html;
  document.getElementById("backHome3").addEventListener("click", function(){ go(renderHome); });
  document.getElementById("resetStats").addEventListener("click", function(){
    if(confirm("正答率の記録と間違いノートをすべて削除します。よろしいですか？")){
      localStorage.removeItem(STORE_STATS);
      localStorage.removeItem(STORE_WRONG);
      go(renderStats);
    }
  });
}

/* ---------------- init ---------------- */
go(renderHome);

})();
</script>
</body>
</html>
