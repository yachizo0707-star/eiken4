<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英検4級対策</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2A4A;
  --ink-soft:#55647C;
  --paper:#EEF2F5;
  --paper-line:#D7E0E8;
  --card:#FFFFFF;
  --accent:#E4572E;
  --accent-dim:#F7DAD0;
  --good:#2F9E68;
  --good-dim:#D9F0E4;
  --bad:#D64545;
  --bad-dim:#FBDCDC;
  --gold:#F4C744;
  --radius:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
body{
  margin:0;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 27px, var(--paper-line) 27px, var(--paper-line) 28px),
    var(--paper);
  color:var(--ink);
  font-family:'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
  font-size:16px;
  line-height:1.6;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  min-height:100%;
  padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
}
button, input, select{
  font-family:inherit;
  font-size:16px;
  -webkit-appearance:none;
  appearance:none;
}
h1,h2,h3,.font-display{font-family:'Kosugi Maru', 'Zen Kaku Gothic New', sans-serif;}
.wrap{max-width:640px;margin:0 auto;padding:0 16px;}

/* ---------- ticket header ---------- */
.ticket-header{
  background:var(--ink);
  color:#fff;
  padding-top:calc(18px + env(safe-area-inset-top,0px));
  padding-bottom:18px;
  position:relative;
  margin-bottom:22px;
}
.ticket-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.ticket-header .brand{display:flex;align-items:baseline;gap:8px;}
.ticket-header .brand .kanji{font-family:'Kosugi Maru',sans-serif;font-size:20px;letter-spacing:.02em;}
.ticket-header .brand .en{font-size:11px;color:#AEBBD6;letter-spacing:.08em;}
.ticket-header .stamp{
  font-size:12px;color:#0F1B33;background:var(--gold);
  border-radius:999px;padding:5px 12px;font-weight:700;white-space:nowrap;
}
.ticket-header::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:10px;
  background-image:radial-gradient(circle at 8px 0, transparent 7px, var(--paper) 7.5px);
  background-size:16px 10px;background-repeat:repeat-x;
}

/* ---------- section cards ---------- */
.section-title{
  font-size:15px;font-weight:700;color:var(--ink-soft);
  margin:28px 0 10px;padding-left:2px;
  display:flex;align-items:center;gap:8px;
}
.section-title .bar{width:5px;height:16px;background:var(--accent);border-radius:2px;display:inline-block;}

.card{
  background:var(--card);
  border:1px solid var(--paper-line);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
}

.exam-card{
  display:block;width:100%;text-align:left;
  background:var(--card);
  border:1px solid var(--paper-line);
  border-left:5px solid var(--accent);
  border-radius:var(--radius);
  padding:14px 16px;margin-bottom:10px;
  cursor:pointer;
}
.exam-card .row1{display:flex;justify-content:space-between;align-items:center;}
.exam-card .label{font-weight:700;font-size:16px;}
.exam-card .date{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.exam-card .go{font-size:13px;color:var(--accent);font-weight:700;}
.exam-card.pred{border-left-color:var(--gold);}
.exam-card.pred .go{color:#B98A00;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;
  min-height:44px;
}
.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--paper-line);}
.btn.block{display:flex;width:100%;}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.4;}

.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.pill{
  border:1px solid var(--paper-line);background:#fff;border-radius:999px;
  padding:9px 14px;font-size:13px;cursor:pointer;color:var(--ink-soft);
}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink);}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-box{background:#fff;border:1px solid var(--paper-line);border-radius:12px;padding:12px;}
.stat-box .big{font-size:22px;font-weight:900;font-family:'Kosugi Maru';}
.stat-box .lbl{font-size:12px;color:var(--ink-soft);}
.bar-track{background:var(--paper);border-radius:999px;height:8px;overflow:hidden;margin-top:6px;}
.bar-fill{height:100%;background:var(--accent);border-radius:999px;}

/* ---------- quiz screen ---------- */
.quiz-topbar{
  position:sticky;top:0;z-index:5;
  background:var(--paper);
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-bottom:8px;
}
.progress-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft);}
.progress-track{flex:1;height:6px;background:#fff;border:1px solid var(--paper-line);border-radius:999px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);}
.quit-btn{background:none;border:none;color:var(--ink-soft);font-size:13px;padding:4px 8px;cursor:pointer;}

.q-tag{
  display:inline-block;font-size:11px;font-weight:700;color:#fff;
  background:var(--ink-soft);border-radius:6px;padding:3px 8px;margin-bottom:10px;
}
.q-text{font-size:16px;white-space:pre-line;margin-bottom:14px;}
.passage-box{
  background:var(--paper);border:1px solid var(--paper-line);border-radius:12px;
  padding:14px;margin-bottom:14px;font-size:14.5px;white-space:pre-line;
}
.passage-box h4{margin:0 0 8px;font-size:15px;}
.email-box{border-bottom:1px dashed var(--paper-line);padding-bottom:10px;margin-bottom:10px;}
.email-box:last-child{border-bottom:none;margin-bottom:0;}
.email-meta{font-size:12px;color:var(--ink-soft);margin-bottom:4px;}

.choice{
  display:flex;align-items:center;gap:10px;
  width:100%;text-align:left;background:#fff;
  border:1.5px solid var(--paper-line);border-radius:12px;
  padding:13px 14px;margin-bottom:9px;font-size:15px;cursor:pointer;
  min-height:44px;
}
.choice .num{
  width:24px;height:24px;border-radius:50%;background:var(--paper);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  flex-shrink:0;color:var(--ink-soft);
}
.choice.correct{background:var(--good-dim);border-color:var(--good);}
.choice.correct .num{background:var(--good);color:#fff;}
.choice.incorrect{background:var(--bad-dim);border-color:var(--bad);}
.choice.incorrect .num{background:var(--bad);color:#fff;}
.choice:disabled{cursor:default;}
.choice.dim{opacity:.55;}

.listen-box{
  background:var(--ink);color:#fff;border-radius:14px;padding:18px;margin-bottom:16px;
  display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
}
.listen-btn{
  width:64px;height:64px;border-radius:50%;background:var(--gold);border:none;
  font-size:26px;cursor:pointer;color:#1B2A4A;
}
.listen-hint{font-size:12px;color:#AEBBD6;}
.script-reveal{
  margin-top:10px;font-size:13px;background:rgba(255,255,255,.08);
  border-radius:8px;padding:10px;text-align:left;white-space:pre-line;
}

.explain-box{
  margin-top:14px;background:var(--paper);border-radius:12px;padding:14px;font-size:14px;
}
.explain-box .head{font-weight:700;margin-bottom:6px;}
.explain-box .full-en{margin-top:4px;white-space:pre-line;}
.explain-box .full-jp{margin-top:6px;white-space:pre-line;color:var(--ink-soft);}
.explain-box .mark{color:var(--bad);font-weight:700;}
.explain-box .point{
  margin-top:10px;padding-top:10px;border-top:1px dashed var(--paper-line);
  display:flex;gap:8px;align-items:flex-start;
}
.explain-box .point .icon{flex-shrink:0;font-size:14px;}
.explain-box .point .ptext{font-size:13.5px;color:var(--ink);}
.choice-notes{margin-top:10px;padding-top:10px;border-top:1px dashed var(--paper-line);font-size:13px;color:var(--ink-soft);}
.choice-notes .cn-head{font-weight:700;margin-bottom:4px;color:var(--ink);}
.choice-notes ul{margin:0;padding-left:2px;list-style:none;}
.choice-notes li{padding:2px 0;}
.choice-notes li.cn-correct{color:var(--good);font-weight:700;}
.streak-banner{
  margin-top:10px;background:var(--gold);color:#1B2A4A;font-weight:700;
  border-radius:10px;padding:10px 14px;text-align:center;font-size:14px;
}

/* ---------- flashcards ---------- */
.flash-card{
  background:var(--ink);color:#fff;border-radius:18px;min-height:220px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;cursor:pointer;gap:10px;
}
.flash-face{font-size:24px;font-weight:700;font-family:'Kosugi Maru';}
.flash-hint{font-size:12px;color:#AEBBD6;}
.flash-actions{display:flex;gap:10px;margin-top:14px;}
.flash-actions .btn{flex:1;}

.footer-nav{position:sticky;bottom:0;background:var(--paper);padding:10px 0 4px;margin-top:8px;}

/* ---------- results ---------- */
.score-hero{
  text-align:center;padding:26px 10px;background:var(--ink);color:#fff;
  border-radius:16px;margin-bottom:18px;
}
.score-hero .num{font-family:'Kosugi Maru';font-size:46px;font-weight:700;}
.score-hero .sub{font-size:13px;color:#AEBBD6;margin-top:4px;}
.review-row{
  display:flex;justify-content:space-between;gap:10px;padding:12px 0;
  border-bottom:1px solid var(--paper-line);font-size:14px;
}
.review-row:last-child{border-bottom:none;}
.review-row .ok{color:var(--good);font-weight:700;}
.review-row .ng{color:var(--bad);font-weight:700;}

.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;background:var(--paper);color:var(--ink-soft);margin-left:6px;}
.empty-note{color:var(--ink-soft);font-size:13.5px;padding:18px 4px;text-align:center;}
.hidden{display:none !important;}
a{color:var(--accent);}
</style>
</head>

", "How tall are you?", "How much are they?"], "a": 3, "full": "Man: Excuse me. I want to buy these socks. How much are they?\nClerk: Two dollars.", "jp": "男性「すみません。この靴下を買いたいのですが。おいくらですか。」店員「2ドルです。」", "hlEn": "How much are they?", "hlJp": "おいくらですか", "point": "How much 〜?は値段を尋ねる決まり文句。", "pattern": "疑問詞how much", "choiceNotes": ["元気にしてる?", "いくつ持ってる?", "身長はどれくらい?", "おいくらですか(正解)"]}, {"n": 19, "q": "Daughter: Dad, I can't find my social studies textbook.\nFather: ( )\nDaughter: Thanks.", "choices": ["It's a difficult subject.", "It was very interesting.", "It's on the kitchen table.", "It's for your brother."], "a": 2, "full": "Daughter: Dad, I can't find my social studies textbook.\nFather: It's on the kitchen table.\nDaughter: Thanks.", "jp": "娘「お父さん、社会科の教科書が見つからないの。」父「台所のテーブルの上にあるよ。」娘「ありがとう。」", "hlEn": "It's on the kitchen table.", "hlJp": "台所のテーブルの上にあるよ", "point": "場所を答えるにはIt's on/in/under 〜.のように前置詞を使う。", "pattern": "会話表現(場所)", "choiceNotes": ["難しい科目だね", "面白かったよ", "台所のテーブルの上だよ(正解)", "弟のものだよ"]}, {"n": 20, "q": "Girl1: Jenny, you don't look well today. ( )\nGirl2: I'm fine. I'm just a little tired.", "choices": ["Can I go home?", "Did you call me?", "Are you OK?", "Is your mother a doctor?"], "a": 2, "full": "Girl1: Jenny, you don't look well today. Are you OK?\nGirl2: I'm fine. I'm just a little tired.", "jp": "女の子1「ジェニー、今日は元気なさそうだね。大丈夫?」女の子2「大丈夫だよ。ちょっと疲れてるだけ。」", "hlEn": "Are you OK?", "hlJp": "大丈夫?", "point": "相手の様子を気遣うAre you OK?は会話頻出表現。", "pattern": "会話表現(気遣い)", "choiceNotes": ["帰ってもいい?", "電話くれた?", "大丈夫?(正解)", "お母さんは医者?"]}], "part3": [{"n": 21, "jp": "なぜあなたは今朝、そんなに早く起きたのですか。", "words": ["you", "up", "get", "why", "did"], "template": "__ __ __ __ so early this morning?", "combos": [[0, 1], [4, 2], [2, 4], [3, 0]], "a": 1, "full": "Why did you get up so early this morning?", "point": "疑問詞Why+did+主語+動詞の原形(get up)の疑問文の語順。", "pattern": "疑問文の語順(did)"}, {"n": 22, "jp": "今日の午後、あなたに電話してもいいですか。", "words": ["this", "may", "you", "I", "call"], "template": "__ __ __ __ afternoon?", "combos": [[3, 2], [0, 2], [4, 0], [2, 0]], "a": 0, "full": "May I call you this afternoon?", "point": "May I+動詞の原形 〜?で丁寧に許可を求める文。", "pattern": "May I〜?(許可)"}, {"n": 23, "jp": "ネパールではたくさんの高い山を見ることができます。", "words": ["see", "you", "can", "high mountains", "lots of"], "template": "__ __ __ __ in Nepal.", "combos": [[3, 1], [2, 4], [3, 2], [4, 2]], "a": 1, "full": "You can see lots of high mountains in Nepal.", "point": "can+動詞の原形(see)。lots of+名詞で「たくさんの〜」。", "pattern": "数量表現(lots of)"}, {"n": 24, "jp": "私は毎朝7時に家を出て学校へ向かいます。", "words": ["at", "school", "leave", "for", "home"], "template": "I __ __ __ __ seven o'clock every morning.", "combos": [[4, 2], [2, 3], [4, 1], [2, 4]], "a": 2, "full": "I leave home for school at seven o'clock every morning.", "point": "leave A for Bで「Bに向けてAを出発する」という表現。", "pattern": "文型(leave A for B)"}, {"n": 25, "jp": "これらのコーヒーカップを洗ってくれますか。", "words": ["wash", "you", "coffee cups", "could", "these"], "template": "__ __ __ __, please?", "combos": [[3, 4], [2, 0], [1, 4], [0, 1]], "a": 2, "full": "Could you wash these coffee cups, please?", "point": "Could you+動詞の原形 〜, please?で丁寧な依頼を表す。", "pattern": "Could you〜?(依頼)"}], "part4A": {"title": "A Musician Will Visit Our School", "passage": "The famous piano player Mr. Stevens will visit the school on Friday afternoon for one hour.\n\nHe will first give a speech in the gym and then play three songs in the music room.  After this performance, students can eat snacks in the cafeteria.\n\nDate: February 12\nTime: 4:00 p.m. to 5:00 p.m.", "questions": [{"n": 26, "q": "What will happen in the gym?", "choices": ["A piano player will give a speech.", "Students will receive free snacks.", "A piano player will play songs.", "Students will dance."], "a": 0}, {"n": 27, "q": "How many songs will Mr. Stevens play?", "choices": ["Two songs.", "Three songs.", "Four songs.", "Five songs."], "a": 1}]}, "part4B": {"title": "How are your cats?", "emails": [{"from": "Jimmy Cook", "to": "Cathy Cook", "date": "July 7", "subject": "How are your cats?", "body": "Dear Grandma,\nLast summer was so much fun!  I enjoyed spending two weeks at your home.  How is your cat, Lily?  She had some babies, right?  Dad told me about it.  How many babies does she have?  I really want to see them!  Can I visit your home next month?  I can stay for four days then!\nWrite soon,\nJimmy"}, {"from": "Cathy Cook", "to": "Jimmy Cook", "date": "July 7", "subject": "They are fine!", "body": "Dear Jimmy,\nOf course, come and see my cat Lily and her babies next month!  She has three babies, and they are very cute.  Yesterday, one of my friends visited me and saw them, too!  I'll send you a picture of the babies by email tomorrow!\nLove,\nGrandma"}], "questions": [{"n": 28, "q": "When can Jimmy visit his grandmother's home?", "choices": ["Tomorrow.", "Next week.", "Next month.", "Next summer."], "a": 2}, {"n": 29, "q": "How many babies does Lily have?", "choices": ["One.", "Two.", "Three.", "Four."], "a": 2}, {"n": 30, "q": "Who visited Jimmy's grandmother yesterday?", "choices": ["Her friend.", "Her daughter.", "Jimmy.", "Jimmy's father."], "a": 0}]}, "part4C": {"title": "A Visit to a History Museum", "passage": "George is thirteen years old.  Recently, his sister wanted to go to a history museum.  So, his family went to the museum last Saturday.  The museum was in an old building.  It was eighty years old.  In the museum, he saw many interesting things.  The best part was an old classroom.\n\nGeorge walked into the classroom and saw an old blackboard.  The blackboard was forty years old.  He was surprised because the blackboard was green.  He also saw desks and chairs.  They were dark brown.  Then, George saw some old history textbooks.  He saw a lot of interesting things in the classroom.  He liked looking at the textbooks most because they were so old.\n\nThe history museum was very fun.  George's favorite subjects in school were English and math before, but now his favorite is history.  George wants to go to more museums with his sister.", "questions": [{"n": 31, "q": "Why did George's family go to the museum last Saturday?", "choices": ["George's father had four tickets.", "George's mother works there.", "George's sister wanted to go.", "George likes history."], "a": 2}, {"n": 32, "q": "How old was the blackboard?", "choices": ["Thirteen years old.", "Twenty years old.", "Forty years old.", "Eighty years old."], "a": 2}, {"n": 33, "q": "What color were the desks?", "choices": ["Black.", "Green.", "Light brown.", "Dark brown."], "a": 3}, {"n": 34, "q": "What did George like most in the classroom?", "choices": ["The textbooks.", "The desks.", "The map.", "The blackboard."], "a": 0}, {"n": 35, "q": "Now, George's favorite subject is", "choices": ["math.", "English.", "history.", "music."], "a": 2}]}}, "listening": {"audio": {"part1": "https://media.eiken.or.jp/listening/grade_4/2026_01/4Q-part1.mp3", "part2": "https://media.eiken.or.jp/listening/grade_4/2026_01/4Q-part2.mp3", "part3": "https://media.eiken.or.jp/listening/grade_4/2026_01/4Q-part3.mp3"}, "part1": [{"n": 1, "script": ["Hi, Brian.", "Hi, Sally.  Do you want to watch a soccer game this Saturday?", "Sure.  What time does it start?"], "choices": ["At 1:30.", "On Saturday.", "Let's go now."], "a": 0}, {"n": 2, "script": ["Let's have lunch today.", "Sure, but I have a meeting until noon.", "How about 12:30, then?"], "choices": ["It's near here.", "With Mr. Wilson.", "That's fine."], "a": 2}, {"n": 3, "script": ["Do we have any meetings today?", "Yes, we have one with Alan and Janet this afternoon.", "OK.  Anything else?"], "choices": ["At twelve o'clock.", "No, that's all.", "Yes, he did."], "a": 1}, {"n": 4, "script": ["Excuse me.", "How can I help you?", "Where are the women's shoes?"], "choices": ["On the third floor.", "At six o'clock.", "I'll buy them."], "a": 0}, {"n": 5, "script": ["What time does your volleyball practice start on Saturday?", "At 9 a.m.", "Will you come home by noon?"], "choices": ["I think so.", "Twice a day.", "It's my ball."], "a": 0}, {"n": 6, "script": ["Are you hungry?", "Not really.", "Do you want some coffee?"], "choices": ["That sounds nice.", "Chicken, please.", "In cooking class."], "a": 0}, {"n": 7, "script": ["Is it raining outside?", "No, but the sky is dark.", "Take your umbrella with you."], "choices": ["No, you won't.", "Since this morning.", "All right, Mom."], "a": 2}, {"n": 8, "script": ["I'm going to the beach with my brother.", "That sounds good!", "Do you have any brothers or sisters?"], "choices": ["I don't have any.", "No.  I can't swim.", "Next week."], "a": 0}, {"n": 9, "script": ["Good morning, Mr. Lee.", "Hi.  Where are you going?", "To the library."], "choices": ["It's late at night.", "I studied science.", "Have a nice day."], "a": 2}, {"n": 10, "script": ["How was your sister's birthday?", "We had a big party.", "Did she like it?"], "choices": ["I like chocolate cake.", "Yes.  She got many presents.", "Thank you for coming."], "a": 1}], "part2": [{"n": 11, "script": ["Did you finish your report, Max?", "Yes.  I put it on your desk.", "Really?  I can't find it.", "Oh no."], "question": "What is the woman's problem?", "choices": ["She can't find the report.", "She forgot to call Max.", "The report is too long.", "Her desk is broken."], "a": 0}, {"n": 12, "script": ["How was your weekend, Ken?", "Not so good.  My mom was sick, so my dad took her to the doctor.", "Is she OK now?", "Yes, she's much better."], "question": "Who was sick?", "choices": ["Ken.", "Ken's mother.", "Ken's father.", "Ken's friend."], "a": 1}, {"n": 13, "script": ["Hi, Joe.  Is that a new camera?", "Yes, Kim.  My dad gave it to me.", "Do you like it?", "Yeah, it's great.  I just took some pictures of my friends."], "question": "Who did Joe take pictures of?", "choices": ["Kim's friends.", "Kim's father.", "His friends.", "His father."], "a": 2}, {"n": 14, "script": ["Where are you going?", "I'm going to the hospital.", "Why?  Are you sick?", "No.  My grandmother broke her leg, so I'm going to visit her."], "question": "Why is the man going to the hospital?", "choices": ["Because he is sick.", "Because he broke his leg.", "To talk to his doctor.", "To visit his grandmother."], "a": 3}, {"n": 15, "script": ["Did you start writing your history report today?", "No.  How about you?", "No.  We need to finish them by Friday.", "I'll write mine before class tomorrow."], "question": "What do they need to do by Friday?", "choices": ["Take a test.", "Talk to their history teacher.", "Clean their classroom.", "Finish their reports."], "a": 3}, {"n": 16, "script": ["You can pick one toy from here.", "I want a toy car.", "You already have one.  How about another toy?", "No, I like cars."], "question": "Which toy does the boy want?", "choices": ["A toy dog.", "A robot.", "A toy car.", "A toy plane."], "a": 2}, {"n": 17, "script": ["You have a baseball game today, right?", "Yes.  I also have a soccer game on Wednesday.", "Is your tennis game on Friday?", "That's right."], "question": "Which game does the girl have today?", "choices": ["A tennis game.", "A soccer game.", "A basketball game.", "A baseball game."], "a": 3}, {"n": 18, "script": ["You have a dog, right, Mia?", "Yes, I do.", "What other pets do you have?", "A cat and a bird.  So I have three pets."], "question": "How many pets does Mia have?", "choices": ["One.", "Two.", "Three.", "Four."], "a": 2}, {"n": 19, "script": ["Can we go to a Japanese restaurant for dinner?", "No, I had Japanese food for lunch.", "Where should we go?", "Let's go to an Italian restaurant."], "question": "Where will they go for dinner?", "choices": ["To a Chinese restaurant.", "To a Japanese restaurant.", "To a Spanish restaurant.", "To an Italian restaurant."], "a": 3}, {"n": 20, "script": ["Can we study together today?", "I can't.  I have a meeting at the library.", "How about tomorrow?  We can meet at school.", "OK.  Let's meet at two."], "question": "Where will they meet tomorrow?", "choices": ["At school.", "At the girl's house.", "At the library.", "At the boy's house."], "a": 0}], "part3": [{"n": 21, "script": ["Emma enjoys shopping.  This weekend she will go to the new shopping center with her friend.  She is going to buy a birthday present for her mother."], "question": "What will Emma do this weekend?", "choices": ["Visit her friend.", "Go shopping.", "Go to a party.", "Make a cake."], "a": 1}, {"n": 22, "script": ["My parents and I went to my favorite curry restaurant last night.  It's near our house.  The vegetable curry is really good."], "question": "What is the girl talking about?", "choices": ["Her vegetable garden.", "A cooking class.", "A restaurant.", "Her new house."], "a": 2}, {"n": 23, "script": ["Kathy and Mary play tennis together on Saturday mornings.  Today, it rained, so they went to a shopping mall.  They bought some books there."], "question": "What did Kathy and Mary do today?", "choices": ["They played tennis.", "They saw a movie.", "They went shopping.", "They went to the library."], "a": 2}, {"n": 24, "script": ["After school, I often go to my friend Andrew's house, and we study together.  Sometimes we play computer games, too.  Andrew has lots of great games."], "question": "Where does the boy often go after school?", "choices": ["To the library.", "To a big game.", "To the computer club.", "To his friend's house."], "a": 3}, {"n": 25, "script": ["Wendy had a party at her house yesterday.  She made pasta, and her husband made vegetable soup.  Her friend Julie brought drinks and cake."], "question": "Who made vegetable soup?", "choices": ["Wendy.", "Wendy's husband.", "Julie.", "Julie's husband."], "a": 1}, {"n": 26, "script": ["Emi likes reading.  She often goes to the library.  Today, she will read a book at home after school."], "question": "What will Emi do today?", "choices": ["Go to the library.", "Help her mother.", "Call her friend.", "Read a book at home."], "a": 3}, {"n": 27, "script": ["Jack usually plays soccer or rides his bike with his friends after school.  But it rained yesterday, so he stayed at home and read books in the afternoon."], "question": "What did Jack do yesterday afternoon?", "choices": ["He read books.", "He rode his bike.", "He played soccer.", "He did his homework."], "a": 0}, {"n": 28, "script": ["Yesterday, my father made lunch for Anna and me.  My mother and brother were not home.  My grandmother came to visit me, so I cleaned my house.  Anna helped me."], "question": "What did the girl do yesterday?", "choices": ["She made lunch.", "She visited her grandmother.", "She cleaned her house.", "She met Anna's father."], "a": 2}, {"n": 29, "script": ["Jack usually rides his bike to school when the weather is nice.  When it is rainy, Jack's father takes him to school by car."], "question": "How does Jack usually go to school?", "choices": ["By bike.", "By bus.", "By train.", "By car."], "a": 0}, {"n": 30, "script": ["Welcome to the city art museum.  The fees are three dollars for kids, five dollars for junior high school students, and ten dollars for adults."], "question": "How much is the fee for adults?", "choices": ["Three dollars.", "Five dollars.", "Eight dollars.", "Ten dollars."], "a": 3}]}}, {"id": "2025-3", "label": "2025年度 第3回", "dateStr": "1月25日実施", "reading": {"part1": [{"n": 1, "q": "A: Max is a little ( ), so he loves to play with toy cars.\nB: Yes.  He likes to play video games, too.", "choices": ["child", "dream", "doll", "color"], "a": 0, "full": "A: Max is a little child, so he loves to play with toy cars.\nB: Yes.  He likes to play video games, too.", "jp": "A「マックスはまだ少し子どもだから、おもちゃの車で遊ぶのが大好きなんだ。」B「うん。テレビゲームで遊ぶのも好きだよね。」", "hlEn": "child", "hlJp": "子ども", "point": "a little+名詞で「少し〜」。ここでは「まだ少し子どもだ」の意味。", "pattern": "数量表現(a little)", "choiceNotes": ["子ども(正解)", "夢", "人形", "色"]}, {"n": 2, "q": "A: Will you go to the concert tomorrow?\nB: I ( ) so.", "choices": ["think", "carry", "study", "work"], "a": 0, "full": "A: Will you go to the concert tomorrow?\nB: I think so.", "jp": "A「明日、コンサートに行く?」B「そう思うよ(たぶん行くと思う)。」", "hlEn": "think", "hlJp": "そう思う", "point": "I think so.は「そう思う」という相づちの決まり文句。", "pattern": "会話表現", "choiceNotes": ["思う(正解)", "運ぶ", "勉強する", "働く"]}, {"n": 3, "q": "A: Where's the ( )?  I want to wash my hands.\nB: It's over there.", "choices": ["candy", "tea", "soap", "fish"], "a": 2, "full": "A: Where's the soap?  I want to wash my hands.\nB: It's over there.", "jp": "A「石けんはどこ?手を洗いたいんだ。」B「あそこにあるよ。」", "hlEn": "soap", "hlJp": "石けん", "point": "日常生活の身近な名詞。washとセットで覚える。", "pattern": "語彙:名詞", "choiceNotes": ["お菓子", "お茶", "石けん(正解)", "魚"]}, {"n": 4, "q": "A: The water is so deep here.\nB: It's OK.  Just walk across that ( ).", "choices": ["class", "station", "bridge", "food"], "a": 2, "full": "A: The water is so deep here.\nB: It's OK.  Just walk across that bridge.", "jp": "A「ここは水がとても深いね。」B「大丈夫。その橋を渡ればいいよ。」", "hlEn": "bridge", "hlJp": "橋", "point": "walk across 〜で「〜を歩いて渡る」という意味。", "pattern": "語彙:名詞", "choiceNotes": ["クラス", "駅", "橋(正解)", "食べ物"]}, {"n": 5, "q": "Kelly wants to be a ( ).  She likes to help sick people.", "choices": ["hobby", "class", "present", "doctor"], "a": 3, "full": "Kelly wants to be a doctor.  She likes to help sick people.", "jp": "ケリーは医者になりたいと思っている。彼女は病気の人を助けるのが好きだ。", "hlEn": "doctor", "hlJp": "医者", "point": "want to be a 〜(職業)で「〜になりたい」という将来の夢を表す。", "pattern": "to不定詞(want to be)", "choiceNotes": ["趣味", "クラス", "プレゼント", "医者(正解)"]}, {"n": 6, "q": "A: Can I watch TV now, Dad?\nB: Yes, but you must ( ) the kitchen after dinner.", "choices": ["clean", "meet", "stay", "answer"], "a": 0, "full": "A: Can I watch TV now, Dad?\nB: Yes, but you must clean the kitchen after dinner.", "jp": "A「お父さん、今テレビを見てもいい?」B「いいよ、でも夕食の後に台所を掃除してね。」", "hlEn": "clean", "hlJp": "掃除して", "point": "must+動詞の原形で「〜しなければならない」という義務を表す。", "pattern": "助動詞must(義務)", "choiceNotes": ["掃除する(正解)", "会う", "滞在する", "答える"]}, {"n": 7, "q": "A: I got a new game for my computer.  Let's ( ) it.\nB: OK.", "choices": ["cook", "buy", "try", "wash"], "a": 2, "full": "A: I got a new game for my computer.  Let's try it.\nB: OK.", "jp": "A「パソコン用の新しいゲームを買ったんだ。やってみようよ。」B「いいね。」", "hlEn": "try", "hlJp": "やってみよう", "point": "Let's+動詞の原形で「〜しよう」と誘う表現。", "pattern": "Let's〜(勧誘)", "choiceNotes": ["料理する", "買う", "やってみる(正解)", "洗う"]}, {"n": 8, "q": "A: Hello, Mrs. Smith.  This is Anna.  Is Tracy there?\nB: Just a ( ).  I'll go and get her.", "choices": ["moment", "shower", "number", "program"], "a": 0, "full": "A: Hello, Mrs. Smith.  This is Anna.  Is Tracy there?\nB: Just a moment.  I'll go and get her.", "jp": "A「もしもし、スミスさん。アンナです。トレーシーはいますか。」B「少々お待ちください。呼んできますね。」", "hlEn": "moment", "hlJp": "少々", "point": "Just a moment.は電話や会話で「少々お待ちください」という決まり文句。", "pattern": "会話表現", "choiceNotes": ["少々(正解)", "シャワー", "番号", "番組"]}, {"n": 9, "q": "A: I can't understand this math problem.\nB: Let's ( ) the teacher for help.", "choices": ["tell", "listen", "ask", "shut"], "a": 2, "full": "A: I can't understand this math problem.\nB: Let's ask the teacher for help.", "jp": "A「この数学の問題が分からないよ。」B「先生に聞いてみよう。」", "hlEn": "ask", "hlJp": "聞いてみよう", "point": "ask+人+for helpで「(人)に助けを求める」という意味。", "pattern": "熟語表現", "choiceNotes": ["伝える", "聞く", "尋ねる(正解)", "閉める"]}, {"n": 10, "q": "Bill's math teacher gave him a lot of homework yesterday.  Bill ( ) a hard time because it was difficult.", "choices": ["played", "took", "had", "talked"], "a": 2, "full": "Bill's math teacher gave him a lot of homework yesterday.  Bill had a hard time because it was difficult.", "jp": "ビルの数学の先生は昨日たくさんの宿題を出した。難しかったのでビルは苦労した。", "hlEn": "had", "hlJp": "苦労した", "point": "have a hard timeで「大変な思いをする、苦労する」という決まった表現。", "pattern": "熟語表現", "choiceNotes": ["遊んだ", "持った", "苦労した(正解:have a hard time)", "話した"]}, {"n": 11, "q": "A: It's so cold today.  Can you make me a cup ( ) hot chocolate, please?\nB: Sure.  Just a minute.", "choices": ["at", "to", "as", "of"], "a": 3, "full": "A: It's so cold today.  Can you make me a cup of hot chocolate, please?\nB: Sure.  Just a minute.", "jp": "A「今日はとても寒いね。ホットチョコレートを一杯作ってくれる?」B「いいよ。少し待ってね。」", "hlEn": "of", "hlJp": "一杯", "point": "a cup of 〜で「一杯の〜」という数え方の決まった表現。", "pattern": "数量表現(a cup of)", "choiceNotes": ["〜に", "〜へ", "〜として", "〜の(a cup of・正解)"]}, {"n": 12, "q": "A: What ( ) of dog do you want?\nB: I want a big dog because I love to go on long walks.", "choices": ["room", "wind", "kind", "side"], "a": 2, "full": "A: What kind of dog do you want?\nB: I want a big dog because I love to go on long walks.", "jp": "A「どんな種類の犬が欲しいの?」B「長い散歩に行くのが好きだから、大きい犬が欲しいな。」", "hlEn": "kind", "hlJp": "種類", "point": "What kind of 〜?は「どんな種類の〜」と尋ねる表現。", "pattern": "疑問詞kind of", "choiceNotes": ["部屋", "風", "種類(正解)", "側"]}, {"n": 13, "q": "A: ( ) are you going to go to the park today?\nB: I want to paint a picture.", "choices": ["When", "What", "Where", "Why"], "a": 3, "full": "A: Why are you going to go to the park today?\nB: I want to paint a picture.", "jp": "A「今日は公園に何をしに行くの?」B「絵を描きたいんだ。」", "hlEn": "Why", "hlJp": "何をしに", "point": "Whyで理由を尋ね、答えは目的を表すto不定詞になる。", "pattern": "疑問詞why", "choiceNotes": ["いつ", "何", "どこ", "なぜ(正解)"]}, {"n": 14, "q": "A: What do you do on weekends?\nB: I don't like ( ) TV, so I usually read a book.", "choices": ["to watch", "watch", "watches", "watched"], "a": 0, "full": "A: What do you do on weekends?\nB: I don't like to watch TV, so I usually read a book.", "jp": "A「週末は何をしていますか。」B「テレビを見るのが好きではないので、たいてい本を読みます。」", "hlEn": "to watch", "hlJp": "見るの", "point": "like to+動詞の原形/like+動名詞で「〜するのが好き」。", "pattern": "to不定詞/動名詞", "choiceNotes": ["見ること(to不定詞・正解)", "見る(原形のみは不可)", "見る(3単現)", "見た(過去形)"]}, {"n": 15, "q": "A: What animal is the ( ) in this zoo?\nB: This elephant is.", "choices": ["too old", "older", "oldest", "much older"], "a": 2, "full": "A: What animal is the oldest in this zoo?\nB: This elephant is.", "jp": "A「この動物園で一番年をとっている動物は何ですか。」B「このゾウです。」", "hlEn": "oldest", "hlJp": "一番年をとっている", "point": "3つ以上を比べる最上級は〈the+形容詞+est〉。", "pattern": "最上級", "choiceNotes": ["年をとりすぎた", "より年をとった", "一番年をとった(正解)", "ずっと年をとった"]}], "part2": [{"n": 16, "q": "Son: When does the library open tomorrow?  I need some books for school.\nFather: ( )", "choices": ["At nine o'clock.", "By bus.", "Near here.", "In January."], "a": 0, "full": "Son: When does the library open tomorrow?  I need some books for school.\nFather: At nine o'clock.", "jp": "息子「明日、図書館は何時に開くの?学校用の本が必要なんだ。」父「9時だよ。」", "hlEn": "At nine o'clock.", "hlJp": "9時だよ", "point": "時刻を答えるときはAt+時刻.の形を使う。", "pattern": "会話表現(時刻)", "choiceNotes": ["9時だよ(正解)", "バスでだよ", "この近くだよ", "1月だよ"]}, {"n": 17, "q": "Woman: Excuse me.  Where's the supermarket?\nMan: It's near here.  ( )  You can come with me.", "choices": ["I don't know.", "Please go away.", "I don't have one.", "I'm going there now."], "a": 3, "full": "Woman: Excuse me.  Where's the supermarket?\nMan: It's near here.  I'm going there now.  You can come with me.", "jp": "女性「すみません、スーパーはどこですか。」男性「近くだよ。ちょうど今そこに行くところなんだ。一緒に来ていいよ。」", "hlEn": "I'm going there now.", "hlJp": "ちょうど今そこに行くところ", "point": "現在進行形(be+動詞ing)は「今まさに〜しているところ」を表す。", "pattern": "現在進行形", "choiceNotes": ["知らないな", "あっちへ行って", "持ってないんだ", "今そこに行くところ(正解)"]}, {"n": 18, "q": "Girl: What's your favorite day of the week?\nBoy: ( )  I usually eat dinner with my aunt on that day.", "choices": ["I like Wednesdays.", "It was in April.", "I stayed for two weeks.", "She had a party."], "a": 0, "full": "Girl: What's your favorite day of the week?\nBoy: I like Wednesdays.  I usually eat dinner with my aunt on that day.", "jp": "女の子「一週間のうちで一番好きな曜日は?」男の子「水曜日が好きだな。その日はいつもおばさんと夕食を食べるんだ。」", "hlEn": "I like Wednesdays.", "hlJp": "水曜日が好きだな", "point": "曜日名は複数形にすると「毎週の〜曜日」という習慣を表せる。", "pattern": "語彙:曜日", "choiceNotes": ["水曜日が好き(正解)", "4月だったよ", "2週間滞在した", "パーティーを開いた"]}, {"n": 19, "q": "Sister: What's wrong, David?  Are you tired?\nBrother: ( )  I had a very busy day.", "choices": ["Yeah, I'll go with you.", "Yeah, I slept well last night.", "Yeah, we can do it together.", "Yeah, I need to go to bed now."], "a": 3, "full": "Sister: What's wrong, David?  Are you tired?\nBrother: Yeah, I need to go to bed now.  I had a very busy day.", "jp": "姉「どうしたの、デイビッド?疲れてる?」弟「うん、もう寝る必要があるんだ。とても忙しい一日だったから。」", "hlEn": "Yeah, I need to go to bed now.", "hlJp": "もう寝る必要がある", "point": "Yeahで肯定した後に理由を続ける自然な応答の流れ。", "pattern": "会話表現(理由)", "choiceNotes": ["うん、一緒に行くよ", "うん、よく眠れたよ", "うん、一緒にできるよ", "うん、もう寝ないと(正解)"]}, {"n": 20, "q": "Brother: I can't finish my homework.  It's too difficult.\nSister: ( )  I can help you.\nBrother: Thanks.", "choices": ["Take care.", "Nice talking to you.", "It's ready.", "Don't worry."], "a": 3, "full": "Brother: I can't finish my homework.  It's too difficult.\nSister: Don't worry.  I can help you.\nBrother: Thanks.", "jp": "弟「宿題が終わらないよ。難しすぎる。」姉「心配しないで。手伝ってあげるよ。」弟「ありがとう。」", "hlEn": "Don't worry.", "hlJp": "心配しないで", "point": "Don't+動詞の原形は「〜しないで」という禁止・励ましの表現。", "pattern": "命令文(Don't)", "choiceNotes": ["気をつけてね", "話せて楽しかったよ", "準備できてるよ", "心配しないで(正解)"]}], "part3": [{"n": 21, "jp": "あなたの電話番号を教えていただけますか。", "words": ["number", "may", "your telephone", "I", "have"], "template": "__ __ __ __, please?", "combos": [[3, 2], [1, 2], [4, 0], [2, 0]], "a": 0, "full": "May I have your telephone number, please?", "point": "May I have 〜, please?で丁寧にものを求める表現。", "pattern": "May I〜?(許可)"}, {"n": 22, "jp": "キャロルは昨日7時に家を出て学校へ向かいました。", "words": ["at", "left", "her house", "school", "for"], "template": "Carol __ __ __ __ seven yesterday.", "combos": [[4, 2], [4, 0], [2, 3], [2, 0]], "a": 2, "full": "Carol left her house for school at seven yesterday.", "point": "leave A for Bで「Bに向けてAを出発する」という表現。過去形left。", "pattern": "文型(leave A for B)"}, {"n": 23, "jp": "ポールは今日遅く起きたので、朝食を食べる時間がありませんでした。", "words": ["have", "didn't", "breakfast", "for", "time"], "template": "Paul __ __ __ __ because he got up late today.", "combos": [[3, 4], [4, 2], [2, 1], [0, 3]], "a": 3, "full": "Paul didn't have time for breakfast because he got up late today.", "point": "didn't have time for 〜で「〜する時間がなかった」という否定文。", "pattern": "否定文(didn't)"}, {"n": 24, "jp": "私は、数学のテストについてブラウン先生と放課後に話します。", "words": ["the math test", "about", "will", "talk", "with"], "template": "I __ __ __ __ Mr. Brown after school.", "combos": [[4, 0], [3, 0], [0, 1], [3, 0]], "a": 3, "full": "I will talk about the math test with Mr. Brown after school.", "point": "talk about A with Bで「Bと一緒にAについて話す」という表現。", "pattern": "文型(talk about A with B)"}, {"n": 25, "jp": "私は新しいCDを何回も聞きました。", "words": ["my new CD", "and", "to", "again", "listened"], "template": "I __ __ __ __ again.", "combos": [[1, 2], [1, 3], [3, 2], [4, 3]], "a": 1, "full": "I listened to my new CD again and again.", "point": "listen to 〜で「〜を聞く」。again and againで「何度も」という副詞句。", "pattern": "熟語表現(listen to)"}], "part4A": {"title": "Today's Special at West Juice Shop", "passage": "Grape juice is today's special!\nA glass of grape juice is only $2.\n\nA glass of melon, orange, or peach juice is $5.\n\nFresh fruits for juice come from the farm at 6:00 a.m. every day.\n\nWe are open in the morning from 7:00 a.m. to 11:00 a.m.", "questions": [{"n": 26, "q": "What is today's special juice?", "choices": ["Melon juice.", "Orange juice.", "Grape juice.", "Peach juice."], "a": 2}, {"n": 27, "q": "What time do the fresh fruits come from the farm every day?", "choices": ["At 5:00 a.m.", "At 6:00 a.m.", "At 7:00 a.m.", "At 11:00 a.m."], "a": 1}]}, "part4B": {"title": "It's too cold!", "emails": [{"from": "Emily Hill", "to": "Tina Hill", "date": "December 12", "subject": "It's too cold!", "body": "Hi Mom,\nI just got to Grandma's house.  I couldn't take a bus because there were too many people near the bank's bus stop, so I came here on foot.  Will you come here later?  It's cold and snowy outside.  I wore my sweater and coat and brought an umbrella, but I left my gloves at home.  Can you bring them?\nWrite back soon,\nEmily"}, {"from": "Tina Hill", "to": "Emily Hill", "date": "December 12", "subject": "Yes!", "body": "Hi Emily,\nOK, I'll take your gloves later.  I just got home by train from my office, and yes, it's very cold outside!  At five o'clock, I'll go to the supermarket to buy some chocolate for your grandma.  After that, I'll go to her house by taxi!\nSee you later,\nMom"}], "questions": [{"n": 28, "q": "How did Emily get to her grandmother's house?", "choices": ["On foot.", "By train.", "By bus.", "By taxi."], "a": 0}, {"n": 29, "q": "What did Emily leave at home?", "choices": ["Her sweater.", "Her coat.", "Her gloves.", "Her umbrella."], "a": 2}, {"n": 30, "q": "Where will Emily's mother go at five o'clock?", "choices": ["To the bank.", "To the supermarket.", "To her office.", "To the train station."], "a": 1}]}, "part4C": {"title": "A Friend in Canada", "passage": "Yuki is thirteen years old.  She lives in Osaka.  She has a friend in Canada.  Her friend's name is Paul, and he is fourteen years old.\n\nLast winter, Yuki and her family visited Paul and his parents in Canada for twelve days.  On the first day, Paul showed Yuki and her family around Vancouver.  The next day, they all went to a mountain.\n\nOne day during lunch, Paul asked Yuki, \"Is summer the best season in Japan?\"  Yuki answered, \"No, I like spring because the cherry blossoms are beautiful.\"  Paul is interested in Japanese temples, so he wants to go to Kyoto someday.\n\nOn the last day of the trip, Paul and Yuki looked sad.  When they said goodbye, Paul's mother said, \"See you in Osaka next spring.\"  Yuki's father said, \"Yes.  Please stay with us for a few days.\"  Yuki and Paul were very happy.  Yuki is looking forward to seeing Paul again.", "questions": [{"n": 31, "q": "How old is Paul?", "choices": ["Twelve years old.", "Thirteen years old.", "Fourteen years old.", "Fifteen years old."], "a": 2}, {"n": 32, "q": "When did Yuki and her family visit Canada?", "choices": ["In the spring.", "In the summer.", "In the fall.", "In the winter."], "a": 3}, {"n": 33, "q": "What did Yuki say to Paul about spring in Japan?", "choices": ["The food is not good.", "The temples are crowded.", "The cherry blossoms are beautiful.", "The mountains are dangerous."], "a": 2}, {"n": 34, "q": "Paul wants to go to Kyoto because", "choices": ["he is interested in Japanese temples.", "he loves Japanese food.", "his grandparents live there.", "his Japanese teacher is from there."], "a": 0}, {"n": 35, "q": "What is Yuki looking forward to?", "choices": ["Visiting a different country.", "Seeing Paul again.", "Making dinner with Paul's mother.", "Studying English in Canada."], "a": 1}]}}, "listening": {"audio": {"part1": "https://media.eiken.or.jp/listening/grade_4/2025-30/4Q-part1.mp3", "part2": "https://media.eiken.or.jp/listening/grade_4/2025-30/4Q-part2.mp3", "part3": "https://media.eiken.or.jp/listening/grade_4/2025-30/4Q-part3.mp3"}, "part1": [{"n": 1, "script": ["Do you still live on Birch Street?", "No, I moved to Oak Street.", "How is your new house?"], "choices": ["I know that place.", "You can do it.", "I really like it."], "a": 2}, {"n": 2, "script": ["Lisa?", "What is it, Mike?", "Did you see my blue pen?"], "choices": ["It's here.", "Some paper.", "Three hours."], "a": 0}, {"n": 3, "script": ["When's your big basketball game?", "Next Monday.", "Will you practice this weekend?"], "choices": ["Of course.", "It's my ball.", "You, too."], "a": 0}, {"n": 4, "script": ["Here's your library card, and your books.", "Thank you.", "You have to bring them back next week."], "choices": ["This is my favorite.", "I see.", "Nice to meet you."], "a": 1}, {"n": 5, "script": ["I'm excited about this weekend.", "Why?", "I'm going to go camping."], "choices": ["A picture of a mountain.", "It's my tent.", "Have a good time."], "a": 2}, {"n": 6, "script": ["How's your brother?", "He just moved to go to university.", "Where is he now?"], "choices": ["A few weeks ago.", "He lives in Tokyo.", "We took the train."], "a": 1}, {"n": 7, "script": ["I'm going to be late for my train.", "Where are you going?", "To the stadium."], "choices": ["It was $50.", "You can take a bus.", "My uncle's house."], "a": 1}, {"n": 8, "script": ["Is that your new computer?", "Yes, it is.", "When did you get it?"], "choices": ["One month ago.", "About $50.", "Mom likes it."], "a": 0}, {"n": 9, "script": ["Can I walk your dog?", "Sure.  Where do you want to go?", "To the park."], "choices": ["He's working.", "That's good.", "Five years old."], "a": 1}, {"n": 10, "script": ["Let's buy some flowers.", "Good idea.", "What are your favorite colors?"], "choices": ["On the third floor.", "I like blue and purple.", "I bought some apples."], "a": 1}], "part2": [{"n": 11, "script": ["What's our next class, Gina?", "History.", "Oh, that's right.", "We have math after lunch."], "question": "Which class do they have next?", "choices": ["History.", "Math.", "English.", "Science."], "a": 0}, {"n": 12, "script": ["Can you ski?", "Yes.  I learned last winter.  How about you?", "My father will teach me this weekend.", "Great.  Let's go skiing together next month."], "question": "When will the girl learn to ski?", "choices": ["Tomorrow.", "This weekend.", "Next month.", "Next winter."], "a": 0}, {"n": 13, "script": ["Did you bring my book?", "Sorry.  I left it in my bedroom.", "That's OK.  Did you finish reading it?", "Yes.  It was great."], "question": "What are they talking about?", "choices": ["Their favorite movie.", "The boy's book.", "The girl's bedroom.", "The library."], "a": 3}, {"n": 14, "script": ["Ted, when will you leave for Europe?", "Tomorrow.  I'll stay in France for one week and Spain for five days.", "Have fun.", "Thanks.  See you next month."], "question": "How long will Ted stay in Spain?", "choices": ["For one day.", "For five days.", "For one week.", "For five weeks."], "a": 1}, {"n": 15, "script": ["How's your new school?", "My teachers are nice, and the gym is new.", "What do you like the best?", "The cafeteria.  It's big."], "question": "What does the girl like the best about her new school?", "choices": ["The cafeteria.", "The gym.", "Her teachers.", "Her friends."], "a": 0}, {"n": 16, "script": ["Can you help me with the math homework?", "Sorry, I'm doing my science homework.", "I'll ask the teacher for help.", "OK."], "question": "What does the girl need help with?", "choices": ["The science homework.", "The English homework.", "The history homework.", "The math homework."], "a": 0}, {"n": 17, "script": ["Dad, what's for lunch?", "We can have sandwiches or noodles.", "I had toast for breakfast.  I don't want sandwiches.", "OK, we'll have noodles."], "question": "What did the girl have for breakfast?", "choices": ["Sandwiches.", "Toast.", "Soup.", "Noodles."], "a": 1}, {"n": 18, "script": ["Is the class trip next month?", "No.  It's next Friday.", "What time will it start?", "At 9:00 a.m.  We'll go to the zoo."], "question": "When is the class trip?", "choices": ["Next Friday.", "Next Saturday.", "Next month.", "Next Sunday."], "a": 3}, {"n": 19, "script": ["I bought you a present.", "Thank you, Oliver!  Are they socks?", "No.  I bought black gloves for you.", "How nice!"], "question": "What did Oliver buy for the woman?", "choices": ["Some new shoes.", "Some pants.", "Some socks.", "Some gloves."], "a": 3}, {"n": 20, "script": ["Excuse me, where is the nearest station?", "There's one at the end of this street.", "How long does it take to walk there?", "It takes five minutes to walk there."], "question": "How long does it take to walk to the station?", "choices": ["One minute.", "Five minutes.", "Seven minutes.", "Fifteen minutes."], "a": 0}], "part3": [{"n": 21, "script": ["Welcome to Tony's Burger Shop.  Today's special is a cheeseburger with a salad.  We also have six kinds of ice cream for dessert."], "question": "Where is the man talking?", "choices": ["At home.", "At a restaurant.", "At a clothes shop.", "At a bank."], "a": 1}, {"n": 22, "script": ["Last Saturday, I ate dinner with my girlfriend.  On Sunday morning, I played soccer with some friends.  After lunch, I watched TV."], "question": "What did the man do on Saturday?", "choices": ["He made a new friend.", "He ate with his girlfriend.", "He watched TV.", "He played soccer."], "a": 1}, {"n": 23, "script": ["Tina got some paint and a paintbrush for her birthday.  Today, she'll go and buy some nice paper.  She's going to paint a picture of her bicycle."], "question": "What will Tina buy today?", "choices": ["A brush.", "Some pictures.", "Some paper.", "A bicycle."], "a": 2}, {"n": 24, "script": ["My family went on a trip to the beach last week.  We went by car because we took our dog."], "question": "What is the boy talking about?", "choices": ["His favorite sport.", "His family trip.", "His favorite animal.", "His new car."], "a": 1}, {"n": 25, "script": ["My family has a beautiful garden.  We have many cherry trees and flowers.  I like to sit under the trees in spring."], "question": "What is the girl talking about?", "choices": ["Her favorite fruit.", "Her favorite flower.", "Her spring vacation.", "Her family's garden."], "a": 3}, {"n": 26, "script": ["Yesterday, the weather changed many times.  It was cloudy in the morning but sunny in the afternoon.  After I returned home at night, it started to rain."], "question": "How was the weather yesterday afternoon?", "choices": ["Sunny.", "Cloudy.", "Windy.", "Rainy."], "a": 0}, {"n": 27, "script": ["Sarah went to the supermarket yesterday.  The fruits looked delicious, so she bought two oranges, three pineapples, and five peaches.  Today, she'll make a fruitcake."], "question": "How many pineapples did Sarah buy yesterday?", "choices": ["Two.", "Three.", "Four.", "Five."], "a": 1}, {"n": 28, "script": ["I lost my keys yesterday.  I looked in my bag, but they were not there.  I looked for them in my car and at home.  I found them at work."], "question": "Where were the woman's keys?", "choices": ["In her bag.", "In her car.", "At work.", "At home."], "a": 2}, {"n": 29, "script": ["Daniel lives alone.  Yesterday, he called his mother many times, but she didn't answer.  So, he was very worried.  Today, he'll call his father and brother to ask about her."], "question": "Who did Daniel call yesterday?", "choices": ["His father.", "His brother.", "His mother.", "His grandmother."], "a": 2}, {"n": 30, "script": ["I'll go to the park next Sunday to play with my dog.  There are many places for him to run and have fun, and I'll bring a ball for him."], "question": "Why will the man go to the park next Sunday?", "choices": ["He will join a baseball game.", "He will play with his dog.", "He will join a running event.", "He will look for quiet places."], "a": 1}]}}, {"id": "2025-2", "label": "2025年度 第2回", "dateStr": "10月5日実施", "reading": {"part1": [{"n": 1, "q": "Last night, Paul studied with his sister.  She couldn't ( ) her homework, so Paul helped her.", "choices": ["wash", "understand", "play", "open"], "a": 1, "full": "Last night, Paul studied with his sister.  She couldn't understand her homework, so Paul helped her.", "jp": "昨夜、ポールは妹と一緒に勉強した。彼女は宿題が理解できなかったので、ポールが手伝ってあげた。", "hlEn": "understand", "hlJp": "理解できなかった", "point": "couldn't+動詞の原形は「〜できなかった」という過去の不可能を表す。", "pattern": "助動詞could(過去の可能)", "choiceNotes": ["洗う", "理解する(正解)", "遊ぶ", "開ける"]}, {"n": 2, "q": "A: Is your train ( ) to Osaka in your pocket?\nB: No, it's on the table.", "choices": ["car", "pencil", "shirt", "ticket"], "a": 3, "full": "A: Is your train ticket to Osaka in your pocket?\nB: No, it's on the table.", "jp": "A「大阪行きの電車の切符はポケットの中にある?」B「ううん、テーブルの上だよ。」", "hlEn": "ticket", "hlJp": "切符", "point": "乗り物に乗るときに必要な身近な名詞。", "pattern": "語彙:名詞", "choiceNotes": ["車", "鉛筆", "シャツ", "切符(正解)"]}, {"n": 3, "q": "Helen's tennis lesson will ( ) at five o'clock on Saturday.", "choices": ["take", "end", "put", "make"], "a": 1, "full": "Helen's tennis lesson will end at five o'clock on Saturday.", "jp": "ヘレンのテニスのレッスンは土曜日の5時に終わる予定だ。", "hlEn": "end", "hlJp": "終わる", "point": "willの後は動詞の原形。endは「終わる」という意味の基本動詞。", "pattern": "助動詞will(未来)", "choiceNotes": ["取る", "終わる(正解)", "置く", "作る"]}, {"n": 4, "q": "A: Did you see the ( ) on TV, Mom?  A giraffe at the zoo had a baby.\nB: Yes, I saw it.  It was so cute.", "choices": ["news", "weather", "sport", "bag"], "a": 0, "full": "A: Did you see the news on TV, Mom?  A giraffe at the zoo had a baby.\nB: Yes, I saw it.  It was so cute.", "jp": "A「お母さん、テレビのニュース見た?動物園のキリンに赤ちゃんが生まれたんだって。」B「見たよ。とてもかわいかったね。」", "hlEn": "news", "hlJp": "ニュース", "point": "see the news on TVで「テレビでニュースを見る」という表現。", "pattern": "熟語表現", "choiceNotes": ["ニュース(正解)", "天気", "スポーツ", "かばん"]}, {"n": 5, "q": "A: What does your brother do, Ms. Brown?\nB: He's a ( ) student.  He studies computer science.", "choices": ["towel", "mistake", "college", "station"], "a": 2, "full": "A: What does your brother do, Ms. Brown?\nB: He's a college student.  He studies computer science.", "jp": "A「弟さんは何をしているの、ブラウン先生?」B「大学生だよ。コンピューターサイエンスを勉強しているんだ。」", "hlEn": "college", "hlJp": "大学生", "point": "a college studentで「大学生」という意味。", "pattern": "熟語表現", "choiceNotes": ["タオル", "間違い", "大学(生)(正解)", "駅"]}, {"n": 6, "q": "After the big game yesterday, the soccer team was very happy.  Today is a ( ), so the players can relax.", "choices": ["holiday", "bank", "friend", "pool"], "a": 0, "full": "After the big game yesterday, the soccer team was very happy.  Today is a holiday, so the players can relax.", "jp": "昨日の大きな試合の後、サッカーチームはとても喜んでいた。今日は休日なので、選手たちはくつろぐことができる。", "hlEn": "holiday", "hlJp": "休日", "point": "soで前後をつなぎ、「〜なので…できる」という結果を表す。", "pattern": "接続詞so(結果)", "choiceNotes": ["休日(正解)", "銀行", "友達", "プール"]}, {"n": 7, "q": "A: When will you ( ) cleaning your room?\nB: By six o'clock.", "choices": ["visit", "finish", "remember", "leave"], "a": 1, "full": "A: When will you finish cleaning your room?\nB: By six o'clock.", "jp": "A「いつ部屋の掃除を終わらせるの?」B「6時までにね。」", "hlEn": "finish", "hlJp": "終わらせる", "point": "finish+動名詞(〜ing)で「〜し終える」という意味。", "pattern": "動名詞(finish ~ing)", "choiceNotes": ["訪ねる", "終える(正解)", "覚えている", "去る"]}, {"n": 8, "q": "The library is open ( ) nine to seven.  Many people go there in the morning.", "choices": ["among", "from", "over", "with"], "a": 1, "full": "The library is open from nine to seven.  Many people go there in the morning.", "jp": "図書館は9時から7時まで開いている。多くの人が午前中にそこへ行く。", "hlEn": "from", "hlJp": "から", "point": "from A to Bで「AからBまで」という範囲を表す決まった形。", "pattern": "前置詞from/to", "choiceNotes": ["〜の中で", "〜から(正解)", "〜を越えて", "〜と一緒に"]}, {"n": 9, "q": "A: Mom, I'm having ( ) with my homework.\nB: OK, I'll help you with it.", "choices": ["action", "type", "world", "trouble"], "a": 3, "full": "A: Mom, I'm having trouble with my homework.\nB: OK, I'll help you with it.", "jp": "A「お母さん、宿題で困っているの。」B「わかった、手伝うよ。」", "hlEn": "trouble", "hlJp": "困っている", "point": "have trouble with 〜で「〜で困っている、苦労している」という表現。", "pattern": "熟語表現", "choiceNotes": ["行動", "タイプ", "世界", "困りごと(正解)"]}, {"n": 10, "q": "Mr. Smith usually ( ) the housework on Sunday mornings.  After that, he likes to read magazines.", "choices": ["does", "uses", "holds", "gives"], "a": 0, "full": "Mr. Smith usually does the housework on Sunday mornings.  After that, he likes to read magazines.", "jp": "スミスさんはたいてい日曜の朝に家事をする。その後、彼は雑誌を読むのが好きだ。", "hlEn": "does", "hlJp": "する", "point": "do the houseworkで「家事をする」という決まった言い方。主語が3人称単数なのでdoesになる。", "pattern": "3人称単数現在形", "choiceNotes": ["する(正解:3単現のdoes)", "使う", "開催する", "与える"]}, {"n": 11, "q": "A: Bye, Mom.  Dan and I are going to a party.\nB: OK, have a good ( ).", "choices": ["job", "help", "time", "taste"], "a": 2, "full": "A: Bye, Mom.  Dan and I are going to a party.\nB: OK, have a good time.", "jp": "A「じゃあね、お母さん。ダンと私はパーティーに行くの。」B「わかった、楽しんできてね。」", "hlEn": "time", "hlJp": "楽しんできてね", "point": "have a good timeで「楽しい時間を過ごす」という決まった表現。", "pattern": "熟語表現", "choiceNotes": ["仕事", "助け", "楽しい時間(正解)", "味"]}, {"n": 12, "q": "Daniel is fourteen years ( ).  He is very good at sports.", "choices": ["old", "light", "big", "short"], "a": 0, "full": "Daniel is fourteen years old.  He is very good at sports.", "jp": "ダニエルは14歳だ。彼はスポーツがとても得意だ。", "hlEn": "old", "hlJp": "歳", "point": "数字+years oldで「〜歳」という年齢の言い方。", "pattern": "熟語表現(年齢)", "choiceNotes": ["〜歳(正解)", "軽い", "大きい", "短い"]}, {"n": 13, "q": "Henry ( ) home from school early yesterday because he was sick.", "choices": ["came", "comes", "come", "coming"], "a": 0, "full": "Henry came home from school early yesterday because he was sick.", "jp": "ヘンリーは昨日、体調が悪かったので学校から早く帰ってきた。", "hlEn": "came", "hlJp": "帰ってきた", "point": "yesterdayがあるので過去形。come-came-comeの不規則変化。", "pattern": "不規則動詞の過去形", "choiceNotes": ["帰った(正解:過去形)", "帰る(3単現)", "帰る(原形)", "帰っている(ing形)"]}, {"n": 14, "q": "A: Many of the buildings in this city are very big.\nB: Yes, but this one is the ( ).", "choices": ["large", "largest", "larger", "too large"], "a": 1, "full": "A: Many of the buildings in this city are very big.\nB: Yes, but this one is the largest.", "jp": "A「この街の建物の多くはとても大きいね。」B「うん、でもこれが一番大きいよ。」", "hlEn": "largest", "hlJp": "一番大きい", "point": "3つ以上を比べる最上級は〈the+形容詞+est〉。", "pattern": "最上級", "choiceNotes": ["大きい", "一番大きい(正解)", "より大きい", "大きすぎる"]}, {"n": 15, "q": "A: What's your town like, Tom?\nB: It's nice.  ( ) are lots of parks and a big pool.", "choices": ["They", "Those", "There", "Their"], "a": 2, "full": "A: What's your town like, Tom?\nB: It's nice.  There are lots of parks and a big pool.", "jp": "A「あなたの町はどんな感じ、トム?」B「いいところだよ。公園や大きなプールがたくさんあるんだ。」", "hlEn": "There", "hlJp": "たくさんある", "point": "There are 〜.で「〜がある」という存在を表す構文。", "pattern": "There is/are構文", "choiceNotes": ["それらは", "あれらは", "〜がある(There are・正解)", "彼らの"]}], "part2": [{"n": 16, "q": "Daughter: Can I go outside to play now?\nFather: No, ( )", "choices": ["wash the dishes first.", "have fun.", "I don't like it very much.", "it's not yours."], "a": 0, "full": "Daughter: Can I go outside to play now?\nFather: No, wash the dishes first.", "jp": "娘「今から外で遊んできてもいい?」父「だめだよ、まず皿を洗ってね。」", "hlEn": "wash the dishes first.", "hlJp": "まず皿を洗って", "point": "No,の後に具体的な指示を続けて理由を説明する応答の流れ。", "pattern": "会話表現(指示)", "choiceNotes": ["先に皿を洗って(正解)", "楽しんで", "あまり好きじゃない", "あなたのものじゃない"]}, {"n": 17, "q": "Son: I'm going to make some rice balls for the picnic.  ( )\nMother: About five or six.", "choices": ["How many should I make?", "What did you make?", "Do you like them?", "Are you good at cooking?"], "a": 0, "full": "Son: I'm going to make some rice balls for the picnic.  How many should I make?\nMother: About five or six.", "jp": "息子「ピクニック用におにぎりを作るね。いくつ作ればいい?」母「5個か6個くらいね。」", "hlEn": "How many should I make?", "hlJp": "いくつ作ればいい?", "point": "How many+名詞の複数形?で数を尋ねる表現。", "pattern": "疑問詞how many", "choiceNotes": ["いくつ作ればいい?(正解)", "何を作ったの?", "好き?", "料理が得意?"]}, {"n": 18, "q": "Mother: Do you want some more pizza, Daniel?\nSon: Yes, ( )", "choices": ["I want to cook dinner.", "I can't eat it.", "I don't think so.", "I'm really hungry."], "a": 3, "full": "Mother: Do you want some more pizza, Daniel?\nSon: Yes, I'm really hungry.", "jp": "母「ピザ、もっと食べる、ダニエル?」息子「うん、すごくお腹すいてるんだ。」", "hlEn": "I'm really hungry.", "hlJp": "すごくお腹すいてるんだ", "point": "Yes,の後に理由を添える自然な会話の流れ。", "pattern": "会話表現(理由)", "choiceNotes": ["夕食を作りたい", "食べられない", "そう思わない", "すごくお腹すいてる(正解)"]}, {"n": 19, "q": "Man: ( ) Susan.  How was your camping trip?\nWoman: It was wonderful.", "choices": ["Good luck,", "Welcome back,", "Have a good day,", "Not at all,"], "a": 1, "full": "Man: Welcome back, Susan.  How was your camping trip?\nWoman: It was wonderful.", "jp": "男性「おかえり、スーザン。キャンプ旅行はどうだった?」女性「素晴らしかったよ。」", "hlEn": "Welcome back,", "hlJp": "おかえり", "point": "Welcome back.は「おかえりなさい」と帰ってきた人を迎える表現。", "pattern": "会話表現(あいさつ)", "choiceNotes": ["頑張って", "おかえり(正解)", "良い一日を", "どういたしまして"]}, {"n": 20, "q": "Boy: I always do well in math class.  ( )\nGirl: Oh, can you study with me?  Maybe you can help me.", "choices": ["I like history.", "It's easy.", "It's really short.", "She's my teacher."], "a": 1, "full": "Boy: I always do well in math class.  It's easy.\nGirl: Oh, can you study with me?  Maybe you can help me.", "jp": "男の子「僕はいつも数学の授業でいい成績を取るんだ。簡単だよ。」女の子「へえ、一緒に勉強してくれる?もしかしたら助けてくれるかも。」", "hlEn": "It's easy.", "hlJp": "簡単だよ", "point": "itは前の文の内容(数学の授業)を指す代名詞。", "pattern": "代名詞it", "choiceNotes": ["歴史が好き", "簡単だよ(正解)", "本当に短い", "彼女が先生なんだ"]}], "part3": [{"n": 21, "jp": "祖父は去年初めて飛行機に乗りました。", "words": ["a plane", "for", "my grandfather", "took", "the first"], "template": "__ __ __ __ time last year.", "combos": [[0, 2], [2, 0], [3, 2], [3, 1]], "a": 3, "full": "My grandfather took a plane for the first time last year.", "point": "for the first timeで「初めて」という副詞句。", "pattern": "熟語表現(for the first time)"}, {"n": 22, "jp": "良夫君、あなたの英語の宿題を見せてください。", "words": ["your", "homework", "English", "show", "me"], "template": "Yoshio, please __ __ __ __ .", "combos": [[2, 0], [2, 3], [3, 1], [4, 2]], "a": 3, "full": "Yoshio, please show me your English homework.", "point": "show A Bで「AにBを見せる」という第4文型(SVOO)。", "pattern": "文型(show A B)"}, {"n": 23, "jp": "お母さん、明日は家の掃除をしなければいけませんか。", "words": ["have", "we", "clean", "to", "our"], "template": "Mom, do __ __ __ __ house tomorrow?", "combos": [[1, 0], [4, 0], [0, 2], [4, 1]], "a": 2, "full": "Mom, do we have to clean our house tomorrow?", "point": "have to+動詞の原形で「〜しなければならない」という義務を表す疑問文。", "pattern": "助動詞have to(義務)"}, {"n": 24, "jp": "私は、よく兄と映画について話します。", "words": ["with", "movies", "talk", "about", "my"], "template": "I often __ __ __ __ brother.", "combos": [[2, 1], [3, 2], [4, 2], [3, 0]], "a": 3, "full": "I often talk about movies with my brother.", "point": "talk about A with Bで「Bと一緒にAについて話す」という表現。", "pattern": "文型(talk about A with B)"}, {"n": 25, "jp": "ビル、君はどんな種類のアイスクリームが好きですか。", "words": ["ice cream", "what", "kind", "do", "of"], "template": "Bill, __ __ __ __ you like?", "combos": [[1, 3], [1, 4], [2, 0], [3, 2]], "a": 2, "full": "Bill, what kind of ice cream do you like?", "point": "what kind of 〜で「どんな種類の〜」と尋ねる疑問文。", "pattern": "疑問詞kind of"}], "part4A": {"title": "Volunteer at the Beach", "passage": "Students can volunteer to clean the beach this weekend.\n\nDates: July 17 and July 18\nTime: 9:00 a.m. to 11:00 a.m.\nPlace: Lagoon Beach\n\nThe beach will be hot, so please wear a hat and bring a water bottle.  Please send an e-mail to Mr. Kelsey before July 15 if you want to join.", "questions": [{"n": 26, "q": "What should students bring to the beach?", "choices": ["A water bottle.", "A bat.", "A beach towel.", "Money for lunch."], "a": 0}, {"n": 27, "q": "When should students send an e-mail to Mr. Kelsey?", "choices": ["Before July 7.", "Before July 15.", "On July 17.", "On July 18."], "a": 1}]}, "part4B": {"title": "This weekend", "emails": [{"from": "Kate Osmond", "to": "Lily Billings", "date": "November 29", "subject": "This weekend", "body": "Hi Lily,\nChristmas is next month!  I can't wait for our Christmas party.  It'll start at 9:00 a.m. on Thursday.  What will you bring to the party?  I want to give Christmas cards to our classmates.  Are you free this Saturday, around 12:30 p.m.?  Do you want to come to my house and make cards together?\nYour friend,\nKate"}, {"from": "Lily Billings", "to": "Kate Osmond", "date": "November 30", "subject": "Sounds good", "body": "Hi Kate,\nI'll bring some cakes to the party.  My grandmother will make them.  She makes Christmas cakes every year.  On Saturday, I'll go to the beach with my parents.  How about Sunday?  I have a piano lesson until 10:30 a.m., but I can come to your house around 1:30 p.m.  We can make cards then.\nBye,\nLily"}], "questions": [{"n": 28, "q": "Who does Kate want to give cards to?", "choices": ["Her classmates.", "Her parents.", "Her grandmother.", "Lily's family."], "a": 0}, {"n": 29, "q": "What will Lily do on Sunday?", "choices": ["Go to a piano lesson.", "Make a cake.", "Go to the beach.", "Visit her grandparents."], "a": 0}, {"n": 30, "q": "On Sunday, Lily can go to Kate's house around", "choices": ["9:00 a.m.", "10:30 a.m.", "12:30 p.m.", "1:30 p.m."], "a": 3}]}, "part4C": {"title": "Studying Abroad", "passage": "Ken is a junior high school student in Kanagawa.  He loves soccer.  He also likes meeting people, so he enjoys traveling abroad.  Last summer, he did a homestay in Australia.\n\nKen's host family lived in a big city with many shops and restaurants.  On weekends, they sometimes drove to the beach or the mountains.\n\nKen went to a school in Australia, and he joined the school's soccer team.  At first, he couldn't speak to his teammates in English.  But he met a kind teammate.  His name was John.  They practiced soccer together every day, and John helped Ken with his English, too.  Ken studied English and practiced soccer harder than before.\n\nKen played well in his last game in Australia, and his team won the game.  Ken said, \"I learned a lot from you, John.  Thank you.\"  Now, Ken is back in Japan.  Every weekend, he calls John to practice his English.", "questions": [{"n": 31, "q": "Why does Ken enjoy traveling abroad?", "choices": ["He likes teaching people Japanese.", "He likes meeting people.", "He likes visiting his cousins.", "He likes learning about foreign food."], "a": 1}, {"n": 32, "q": "Where did Ken's host family live?", "choices": ["In a big city.", "Next to the beach.", "By a mountain.", "Near a stadium."], "a": 0}, {"n": 33, "q": "John was Ken's", "choices": ["P.E. teacher.", "soccer coach in Japan.", "host father.", "teammate in Australia."], "a": 3}, {"n": 34, "q": "What did John and Ken do every day?", "choices": ["They practiced soccer.", "They read Japanese books.", "They went to the beach.", "They watched Japanese soccer games."], "a": 0}, {"n": 35, "q": "What does Ken do every weekend now?", "choices": ["He calls John.", "He cooks Australian food.", "He plays soccer with his parents.", "He teaches Japanese."], "a": 0}]}}, "listening": {"audio": {"part1": "https://media.eiken.or.jp/listening/grade_4/2025-2/4Q-part1.mp3", "part2": "https://media.eiken.or.jp/listening/grade_4/2025-2/4Q-part2.mp3", "part3": "https://media.eiken.or.jp/listening/grade_4/2025-2/4Q-part3.mp3"}, "part1": [{"n": 1, "script": ["What are you reading, Bob?", "It's a ski magazine.", "Really?  Can I read it after you finish?"], "choices": ["Me, too.", "Sure, no problem.", "Yes, I do."], "a": 1}, {"n": 2, "script": ["Hi, Grandma.", "Hi, James.  How was school?", "I got a good grade on my math test."], "choices": ["It's tomorrow.", "That's wonderful.", "I'm busy."], "a": 1}, {"n": 3, "script": ["Did you enjoy the zoo?", "Yes.  I love animals.", "What did you like the best?"], "choices": ["The penguins.", "It was raining.", "With my parents."], "a": 0}, {"n": 4, "script": ["Hi, Bill.", "Hi, Sarah.  Do you want to study today?", "Sounds good."], "choices": ["Sure.  You can have mine.", "OK.  See you after school.", "Yes.  It's on my desk."], "a": 1}, {"n": 5, "script": ["Are you open on Sundays?", "Yes, but not all day.", "Will you be open in the evening?"], "choices": ["No, we close at three.", "Right, they're on sale.", "Yes, we still have some."], "a": 0}, {"n": 6, "script": ["How often do you go to the gym?", "Twice a week.", "When do you go?"], "choices": ["I like jogging.", "About one hour.", "Before dinner."], "a": 2}, {"n": 7, "script": ["Mom, I saw a snake in the garden.", "Really?", "Do you like snakes?"], "choices": ["I was cleaning the room.", "No, not really.", "At the pet shop."], "a": 1}, {"n": 8, "script": ["Mommy!  Daddy won't play with me.", "He's tired, Tommy.", "Why?"], "choices": ["He worked yesterday.", "No.  I don't play tennis.", "It's across the street."], "a": 0}, {"n": 9, "script": ["Hi, Daniel.  Where's your father?", "He went to the store, Mom.", "When will he come home?"], "choices": ["For some vegetables.", "About six thirty.", "In the kitchen."], "a": 1}, {"n": 10, "script": ["I went hiking last weekend.", "That's nice.", "What did you do?"], "choices": ["I found it.", "I visited my grandparents.", "I came by bike."], "a": 1}], "part2": [{"n": 11, "script": ["How was your holiday at your uncle's house, Meg?", "It was wonderful, Mr. Brown.  It snowed a lot.", "Did you go skiing?", "Yes, every day.  My uncle taught me.  It was fun!"], "question": "What did Meg do on her holiday?", "choices": ["She went skiing.", "She met Mr. Brown.", "She stayed at home.", "She studied at school."], "a": 0}, {"n": 12, "script": ["What did you get for your birthday, Tommy?", "A new bicycle, Lisa.", "Wow!  Can I see it?", "Yeah.  Come to my house after school today."], "question": "What are they talking about?", "choices": ["Tommy's birthday present.", "Their homework.", "Their new friend.", "Lisa's new bicycle."], "a": 1}, {"n": 13, "script": ["Let's go to the movies tomorrow.", "Sorry, I can't.", "Will you go somewhere?", "Yes, to the airport to meet a friend from Japan."], "question": "Where will the girl go tomorrow?", "choices": ["To the movies.", "To Japan.", "To school.", "To the airport."], "a": 1}, {"n": 14, "script": ["Do you want to see a movie with my sister and me tomorrow?", "I can't.  I'll go fishing.", "Will you go alone?", "Yeah."], "question": "Who will go fishing tomorrow?", "choices": ["The boy.", "The girl.", "The boy's sister.", "The girl's sister."], "a": 1}, {"n": 15, "script": ["Bye, Mike.  I'm going home now.", "Thanks for coming to my party and for the wonderful present.", "You're welcome.  I had a lot of fun.", "See you at school tomorrow."], "question": "What is the girl going to do now?", "choices": ["Go home.", "Go to school.", "Meet Mike.", "Buy a present."], "a": 0}, {"n": 16, "script": ["What are you eating, Mark?", "An apple.", "Don't you like bananas?", "I do, but I always eat them at lunch."], "question": "What is Mark doing now?", "choices": ["Eating an apple.", "Buying a banana.", "Eating a banana.", "Making lunch for the girl."], "a": 3}, {"n": 17, "script": ["Can I use your eraser, Peter?", "Sure.  Where is yours?", "I left it at home.  Maybe on the desk in my room.", "You can use mine all day."], "question": "Where is the girl's eraser?", "choices": ["At school.", "At home.", "In Peter's bag.", "In Peter's room."], "a": 1}, {"n": 18, "script": ["I will go on a trip to Italy next month.", "How long will you be there?", "We will stay for one week.", "That sounds fun!"], "question": "When will the girl go on a trip?", "choices": ["Next week.", "This week.", "This month.", "Next month."], "a": 0}, {"n": 19, "script": ["Where's Ken?  Is he sick?", "No, he's not sick.  He's just late.", "Why is he late for school?", "He got up late today."], "question": "Why is Ken late for school today?", "choices": ["He missed a bus.", "He was busy.", "He was sick.", "He got up late."], "a": 3}, {"n": 20, "script": ["Your English is very good, Sara.", "Thanks.", "Where did you learn it?", "When I was younger, I lived in America for three years."], "question": "How did Sara learn English?", "choices": ["She lived in America.", "Her mother is from America.", "She took English lessons.", "The boy taught it to her."], "a": 1}], "part3": [{"n": 21, "script": ["Last Saturday was my wife's birthday, so we went to a nice restaurant.  We had steak, and we ate cake, too.  We had a very good time."], "question": "What did the man and his wife do last Saturday?", "choices": ["They made a cake.", "They looked for a present.", "They went to a restaurant.", "They cooked some steak."], "a": 2}, {"n": 22, "script": ["Jack gave Sally four apples.  She ate one and gave the other three to her brother.  He loves apples, so he ate all of them."], "question": "How many apples did Jack give to Sally?", "choices": ["One.", "Two.", "Three.", "Four."], "a": 3}, {"n": 23, "script": ["On Sunday mornings, I take a walk in the park near my house.  Then, I read the newspaper in a coffee shop near the station."], "question": "Where does the man read the newspaper?", "choices": ["In a coffee shop.", "In the park.", "At home.", "At the station."], "a": 0}, {"n": 24, "script": ["Everyone in my class is writing reports about different animals.  Tom is writing about ducks, and Steve is writing about hamsters.  I'm writing about pandas."], "question": "Which animal is Tom writing his report about?", "choices": ["Hamsters.", "Ducks.", "Pandas.", "Rabbits."], "a": 1}, {"n": 25, "script": ["My birthday is next week.  Last year, I went to a baseball game on my birthday.  This year, I want to watch a musical."], "question": "What does the boy want to do on his birthday this year?", "choices": ["Play baseball.", "Go to a baseball game.", "Watch a musical.", "Play the piano."], "a": 2}, {"n": 26, "script": ["I asked my brother for help with my math homework.  But he had baseball practice.  My sister was practicing the piano, so I asked my mother for help."], "question": "Who was practicing the piano?", "choices": ["The girl.", "The girl's brother.", "The girl's sister.", "The girl's mother."], "a": 2}, {"n": 27, "script": ["Alice loves to read after she finishes her homework.  She can read one book in three hours.  She reads two books every week."], "question": "How many books does Alice read every week?", "choices": ["One book.", "Two books.", "Three books.", "Four books."], "a": 1}, {"n": 28, "script": ["Olivia will go to a concert at five o'clock.  She will leave her house at three o'clock and take the train to the concert hall.  She will arrive there at 4:30."], "question": "When will Olivia leave her house?", "choices": ["At 3:00.", "At 3:30.", "At 4:30.", "At 5:00."], "a": 0}, {"n": 29, "script": ["I visited my uncle's house yesterday.  It snowed a lot, so I couldn't ride my bike, take a bus, or take a taxi.  I had to walk to his house."], "question": "How did the boy go to his uncle's house?", "choices": ["By bike.", "By bus.", "By taxi.", "On foot."], "a": 3}, {"n": 30, "script": ["I love singing songs.  I want to be a singer in the future, so I decided to join a music school next month."], "question": "What will the girl do next month?", "choices": ["Make a song.", "Join a music school.", "Meet a singer.", "Go to a concert."], "a": 1}]}}, {"id": "pred-1", "label": "予想問題 第1回", "dateStr": "オリジナル予想問題", "reading": {"part1": [{"n": 1, "q": "A: I want to make a sandwich,
