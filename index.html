<script id="app-js">(function(){
"use strict";

var EXAMS = window.EXAM_DATA.exams; // [examA, examB, examC, examD]
var EXAM_MAP = {};
EXAMS.forEach(function(e){ EXAM_MAP[e.id] = e; });

var R_LABELS = {
  part1:"大問1・単語と熟語", part2:"大問2・会話文の完成", part3:"大問3・語句整序",
  part4A:"大問4A・掲示/メモ", part4B:"大問4B・Eメール", part4C:"大問4C・物語文"
};
var L_LABELS = { part1:"リスニング第1部", part2:"リスニング第2部", part3:"リスニング第3部" };
var SEC_SHORT = { R1:"大問1", R2:"大問2", R3:"大問3", R4A:"大問4A", R4B:"大問4B", R4C:"大問4C", L1:"L第1部", L2:"L第2部", L3:"L第3部", CONV:"会話表現" };
var ALL_SECTION_KEYS = ["R1","R2","R3","R4A","R4B","R4C","L1","L2","L3","CONV"];

function secKeyOf(domain, part){
  var p = part.replace("part","");
  return (domain==="reading"?"R":"L") + p;
}
function labelOf(domain, part){
  return domain==="reading" ? R_LABELS[part] : L_LABELS[part];
}

/* ---------------- storage ---------------- */
var STORE_STATS = "eiken4_stats_v1";
var STORE_WRONG = "eiken4_wrong_v1";
var STORE_STAMPS = "eiken4_stamps_v1";
var STREAK_MILESTONES = [3,5,10,15,20,30];

function loadStamps(){
  try{ return JSON.parse(localStorage.getItem(STORE_STAMPS)) || {bestStreak:0, stampCount:0}; }catch(e){ return {bestStreak:0, stampCount:0}; }
}
function saveStamps(s){
  try{ localStorage.setItem(STORE_STAMPS, JSON.stringify(s)); }catch(e){}
}
function removeWrongByKey(key){
  var wrong = loadWrong();
  var idx = -1;
  for(var i=0;i<wrong.length;i++){ if(wrong[i].key===key){ idx=i; break; } }
  if(idx>=0){ wrong.splice(idx,1); saveWrong(wrong); }
}

var STORE_IDIOM_KNOWN = "eiken4_idiom_known_v1"; // kept for storeKey compatibility with DECKS.idiom

function loadStats(){
  try{ return JSON.parse(localStorage.getItem(STORE_STATS)) || {}; }catch(e){ return {}; }
}
function saveStats(s){
  try{ localStorage.setItem(STORE_STATS, JSON.stringify(s)); }catch(e){}
}
function loadWrong(){
  try{ return JSON.parse(localStorage.getItem(STORE_WRONG)) || []; }catch(e){ return []; }
}
function saveWrong(w){
  try{ localStorage.setItem(STORE_WRONG, JSON.stringify(w)); }catch(e){}
}
function recordResult(q, isCorrect, yourText, correctText){
  var stats = loadStats();
  var sk = q.sectionKey;
  if(!stats[sk]) stats[sk] = {attempts:0, correct:0};
  stats[sk].attempts++;
  if(isCorrect) stats[sk].correct++;
  saveStats(stats);

  var wrong = loadWrong();
  var idx = -1;
  for(var i=0;i<wrong.length;i++){ if(wrong[i].key===q.key){ idx=i; break; } }
  if(isCorrect){
    if(idx>=0) wrong.splice(idx,1);
  } else {
    var entry = {
      key:q.key, examId:q.examId, examLabel:q.examLabel, sectionKey:sk,
      sectionLabel:q.sectionLabel, n:q.n, promptShort:q.promptShort,
      correctText:correctText, yourText:yourText, ts:Date.now(),
      pattern:q.pattern||null, hlEn:q.hlEn||null, hlJp:q.hlJp||null
    };
    if(idx>=0) wrong[idx]=entry; else wrong.unshift(entry);
    if(wrong.length>300) wrong.length=300;
  }
  saveWrong(wrong);
}

/* ---------------- helpers ---------------- */
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function esc(s){
  return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
// wraps the first occurrence of `phrase` inside already-escaped `escapedText` with a red <span>.
// phrase itself is escaped the same way before matching so it lines up with escapedText.
function markPhrase(escapedText, phrase){
  if(!phrase) return escapedText;
  var escPhrase = esc(phrase);
  var idx = escapedText.indexOf(escPhrase);
  if(idx<0) return escapedText;
  return escapedText.slice(0,idx) + '<span class="mark">' + escPhrase + '</span>' + escapedText.slice(idx+escPhrase.length);
}

/* ---------------- build question pool ---------------- */
// returns array of "blocks"; each block is {kind:'single', q:...} or {kind:'group', items:[q,...]}
function buildBlocks(examIds, sectionKeys){
  var blocks = [];
  examIds.forEach(function(examId){
    var exam = EXAM_MAP[examId];
    if(!exam) return;
    sectionKeys.forEach(function(sk){
      if(sk[0]==="R"){
        var part = "part" + sk.slice(1);
        if(part==="part1" || part==="part2"){
          (exam.reading[part]||[]).forEach(function(item){
            blocks.push({kind:"single", q:{
              key: exam.id+"_"+sk+"_"+item.n, examId:exam.id, examLabel:exam.label,
              domain:"reading", section:part, sectionKey:sk, sectionLabel:labelOf("reading",part),
              type:"choice", n:item.n, q:item.q, choices:item.choices, a:item.a,
              full:item.full, jp:item.jp, hlEn:item.hlEn, hlJp:item.hlJp, point:item.point,
              pattern:item.pattern, choiceNotes:item.choiceNotes,
              promptShort: item.q.replace(/\n/g," / ").slice(0,40)
            }});
          });
        } else if(part==="part3"){
          (exam.reading.part3||[]).forEach(function(item){
            blocks.push({kind:"single", q:{
              key: exam.id+"_"+sk+"_"+item.n, examId:exam.id, examLabel:exam.label,
              domain:"reading", section:part, sectionKey:sk, sectionLabel:labelOf("reading",part),
              type:"order", n:item.n, jp:item.jp, words:item.words, template:item.template,
              combos:item.combos, a:item.a, full:item.full, point:item.point, pattern:item.pattern,
              promptShort: item.jp.slice(0,40)
            }});
          });
        } else {
          // part4A / part4B / part4C
          var g = exam.reading[part];
          if(!g) return;
          var items = g.questions.map(function(item){
            return {
              key: exam.id+"_"+sk+"_"+item.n, examId:exam.id, examLabel:exam.label,
              domain:"reading", section:part, sectionKey:sk, sectionLabel:labelOf("reading",part),
              type:"passage", n:item.n, q:item.q, choices:item.choices, a:item.a,
              title:g.title, passage:g.passage, emails:g.emails,
              promptShort: item.q.slice(0,40)
            };
          });
          blocks.push({kind:"group", items:items});
        }
      } else {
        var lpart = "part" + sk.slice(1);
        (exam.listening[lpart]||[]).forEach(function(item){
          blocks.push({kind:"single", q:{
            key: exam.id+"_"+sk+"_"+item.n, examId:exam.id, examLabel:exam.label,
            domain:"listening", section:lpart, sectionKey:sk, sectionLabel:labelOf("listening",lpart),
            type:"listen", n:item.n, script:item.script, question:item.question||null,
            choices:item.choices, a:item.a,
            promptShort: (item.question || item.script[item.script.length-1] || "").slice(0,40)
          }});
        });
      }
    });
  });
  return blocks;
}
function flattenBlocks(blocks){
  var list = [];
  blocks.forEach(function(b){
    if(b.kind==="single"){ list.push(b.q); }
    else {
      b.items.forEach(function(it,i){
        it.groupIndex = i; it.groupTotal = b.items.length;
        list.push(it);
      });
    }
  });
  return list;
}

var ALL_EXAM_IDS = EXAMS.map(function(e){ return e.id; });

function buildPatternPool(patterns){
  var blocks = buildBlocks(ALL_EXAM_IDS, ["R1","R2","R3"]);
  var list = flattenBlocks(blocks);
  var convList = window.CONV_DATA.map(function(item, i){
    return {
      key: "conv_"+i, examId:"conv", examLabel:"場面別",
      domain:"conv", section:"conv", sectionKey:"CONV", sectionLabel:"会話表現",
      type:"choice", n:i+1, q:item.q, choices:item.choices, a:item.a,
      full:item.full, jp:item.jp, hlEn:item.hlEn, hlJp:item.hlJp,
      point: item.point, pattern:item.pattern,
      promptShort: item.q.replace(/\n/g," / ").slice(0,40)
    };
  });
  list = list.concat(convList);
  return list.filter(function(q){ return q.pattern && patterns.indexOf(q.pattern)>=0; });
}

/* ---------------- app state / nav ---------------- */
var app = document.getElementById("app");
var headerStamp = document.getElementById("headerStamp");
var SESSION = null;

function go(renderFn){
  window.scrollTo(0,0);
  app.innerHTML = "";
  renderFn();
}

  html += '<div class="section-title"><span class="bar"></span>復習</div>';

/* ---------------- FULL MOCK ---------------- */
function startFullMock(examId){
  var order = ["R1","R2","R3","R4A","R4B","R4C","L1","L2","L3"];
  var blocks = buildBlocks([examId], order);
  var list = flattenBlocks(blocks); // keep official order, no shuffle
  runQuiz(list, EXAM_MAP[examId].label + "（本番形式）", examId);
}

/* ---------------- REVIEW WRONG ---------------- */
function startReview(){
  var wrong = loadWrong();
  if(!wrong.length){ return; }
  var byExam = {};
  wrong.forEach(function(w){ (byExam[w.examId]=byExam[w.examId]||[]).push(w.sectionKey); });
  var list = [];
  Object.keys(byExam).forEach(function(examId){
    var secs = byExam[examId].filter(function(v,i,arr){ return arr.indexOf(v)===i; });
    var blocks = buildBlocks([examId], secs);
    var flat = flattenBlocks(blocks);
    var wrongKeys = wrong.filter(function(w){return w.examId===examId;}).map(function(w){return w.key;});
    flat.forEach(function(q){ if(wrongKeys.indexOf(q.key)>=0) list.push(q); });
  });
  list = shuffle(list);
  runQuiz(list, "間違いノート復習", null);
}

/* ---------------- QUIZ RUNNER ---------------- */
function runQuiz(list, sessionLabel, examId){
  SESSION = { list:list, idx:0, answers:[], label:sessionLabel, examId:examId, streak:0 };
  go(renderQuestion);
}

function currentQ(){ return SESSION.list[SESSION.idx]; }

function renderTopbar(){
  var pct = Math.round((SESSION.idx)/SESSION.list.length*100);
  var html = '<div class="quiz-topbar"><div class="wrap" style="padding:0;">'+
    '<div class="progress-row">'+
    '<button class="quit-btn" id="quitBtn">✕ 中断</button>'+
    '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>'+
    '<span>'+(SESSION.idx+1)+' / '+SESSION.list.length+'</span>'+
    '</div></div></div>';
  return html;
}

function renderQuestion(){
  headerStamp.textContent = SESSION.label.length>10 ? SESSION.label.slice(0,10)+"…" : SESSION.label;
  var q = currentQ();
  var html = renderTopbar();
  html += '<div class="q-tag">'+esc(q.examLabel)+' ・ '+esc(q.sectionLabel)+' No.'+q.n+'</div>';

  if(q.type==="passage" && q.groupIndex===0){
    html += renderPassageBox(q);
  } else if(q.type==="passage"){
    html += renderPassageBox(q, true);
  }

  if(q.type==="passage"){
    html += '<div style="font-size:12px;color:var(--ink-soft);margin-bottom:6px;">設問 '+(q.groupIndex+1)+' / '+q.groupTotal+'</div>';
    html += '<div class="q-text">'+esc(q.q)+'</div>';
    html += renderChoices(q.choices);
  } else if(q.type==="choice"){
    html += '<div class="q-text">'+esc(q.q)+'</div>';
    html += renderChoices(q.choices);
  } else if(q.type==="order"){
    html += '<div class="q-text">'+esc(q.jp)+'</div>';
    html += '<div class="passage-box" style="font-size:16px;text-align:center;letter-spacing:.02em;">'+esc(q.template)+'</div>';
    html += '<div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">使う語句：'+q.words.map(function(w){return esc(w);}).join(" ／ ")+'</div>';
    html += '<div style="font-size:13px;color:var(--ink-soft);margin-bottom:8px;">2番目と4番目にくる語句の正しい組み合わせを選びなさい。</div>';
    var comboLabels = q.combos.map(function(c){ return "2番目: "+q.words[c[0]]+" ／ 4番目: "+q.words[c[1]]; });
    html += renderChoices(comboLabels);
  } else if(q.type==="listen"){
    html += '<div class="listen-box">'+
      '<button class="listen-btn" id="playBtn">🔊</button>'+
      '<div class="listen-hint">タップして音声（合成音声）を再生</div>'+
      '</div>';
    if(q.question){
      html += '<div class="q-text" style="font-weight:700;">'+esc(q.question)+'</div>';
    }
    html += renderChoices(q.choices);
    html += '<div id="scriptReveal"></div>';
  }

  html += '<div id="explainSlot"></div>';
  html += '<div class="footer-nav"><button class="btn block hidden" id="nextBtn">次へ</button></div>';

  app.innerHTML = html;

  document.getElementById("quitBtn").addEventListener("click", function(){
    if(confirm("演習を中断してホームに戻りますか？（ここまでの結果は保存されません）")){
      go(renderHome);
    }
  });

  if(q.type==="listen"){
    document.getElementById("playBtn").addEventListener("click", function(){ speakScript(q); });
  }

  Array.prototype.forEach.call(app.querySelectorAll(".choice"), function(btn){
    btn.addEventListener("click", function(){ onChoose(btn, q); });
  });
}

function renderPassageBox(q, compact){
  var html = '<div class="passage-box">';
  if(!compact) html += '<h4>'+esc(q.title)+'</h4>';
  if(q.emails){
    q.emails.forEach(function(m){
      html += '<div class="email-box"><div class="email-meta">From: '+esc(m.from)+' / To: '+esc(m.to)+' / '+esc(m.date)+'<br>件名: '+esc(m.subject)+'</div>'+esc(m.body)+'</div>';
    });
  } else {
    html += esc(q.passage);
  }
  html += '</div>';
  return html;
}

function renderChoices(choices){
  var html = "";
  var nums = ["1","2","3","4"];
  choices.forEach(function(c,i){
    html += '<button class="choice" data-i="'+i+'"><span class="num">'+nums[i]+'</span><span>'+esc(c)+'</span></button>';
  });
  return html;
}

function speakScript(q){
  if(!("speechSynthesis" in window)){ alert("この端末では音声再生に対応していません。"); return; }
  window.speechSynthesis.cancel();
  var lines = q.script.slice();
  if(q.question) lines = lines.concat([q.question]);
  var i = 0;
  function next(){
    if(i>=lines.length) return;
    var u = new SpeechSynthesisUtterance(lines[i]);
    u.lang = "en-US";
    u.rate = 0.95;
    u.onend = function(){ i++; next(); };
    window.speechSynthesis.speak(u);
  }
  next();
}

function onChoose(btn, q){
  var chosen = parseInt(btn.getAttribute("data-i"),10);
  var correctIdx = q.a;
  var isCorrect = chosen===correctIdx;

  Array.prototype.forEach.call(app.querySelectorAll(".choice"), function(b){
    b.disabled = true;
    var i = parseInt(b.getAttribute("data-i"),10);
    if(i===correctIdx) b.classList.add("correct");
    else if(i===chosen) b.classList.add("incorrect");
    else b.classList.add("dim");
  });

  var choiceTextsSrc = q.type==="order"
    ? q.combos.map(function(c){ return "2番目: "+q.words[c[0]]+" ／ 4番目: "+q.words[c[1]]; })
    : q.choices;
  var yourText = choiceTextsSrc[chosen];
  var correctText = choiceTextsSrc[correctIdx];

  var explain = '<div class="explain-box"><div class="head">'+(isCorrect?"✓ 正解！":"✗ 不正解")+'</div>';
  if(q.type==="order"){
    explain += '<div class="full-en">正しい文: <strong>'+esc(q.full)+'</strong></div>';
  } else if(q.type==="choice"){
    if(!isCorrect){
      explain += '<div>正解: <strong>'+esc(correctText)+'</strong></div>';
    }
    if(q.full){
      explain += '<div class="full-en">'+markPhrase(esc(q.full), q.hlEn)+'</div>';
    }
    if(q.jp){
      explain += '<div class="full-jp">'+markPhrase(esc(q.jp), q.hlJp)+'</div>';
    }
  } else if(!isCorrect){
    explain += '<div>正解: <strong>'+esc(correctText)+'</strong></div>';
  }
  if(q.point){
    explain += '<div class="point"><span class="icon">💡</span><span class="ptext">'+esc(q.point)+'</span></div>';
  }
  if(q.type==="choice" && q.choiceNotes){
    explain += '<div class="choice-notes"><div class="cn-head">選択肢の意味</div><ul>';
    q.choices.forEach(function(c,i){
      var noteText = q.choiceNotes[i] || "";
      explain += '<li'+(i===correctIdx?' class="cn-correct"':'')+'>'+(i+1)+'. '+esc(c)+' — '+esc(noteText)+'</li>';
    });
    explain += '</ul></div>';
  }
  if(q.type==="listen"){
    explain += '<div style="margin-top:8px;"><a href="#" id="showScript">▶ スクリプトを見る</a></div>';
  }
  explain += '</div>';

  // streak tracking
  if(isCorrect){ SESSION.streak++; } else { SESSION.streak = 0; }
  if(isCorrect && STREAK_MILESTONES.indexOf(SESSION.streak)>=0){
    var stamps = loadStamps();
    stamps.stampCount++;
    if(SESSION.streak > stamps.bestStreak) stamps.bestStreak = SESSION.streak;
    saveStamps(stamps);
    explain += '<div class="streak-banner">🔥 '+SESSION.streak+'問連続正解！ スタンプ獲得🏅</div>';
  }

  document.getElementById("explainSlot").innerHTML = explain;

  if(q.type==="listen"){
    document.getElementById("showScript").addEventListener("click", function(ev){
      ev.preventDefault();
      var lines = q.script.slice();
      if(q.question) lines.push("Q: "+q.question);
      document.getElementById("scriptReveal").innerHTML =
        '<div class="script-reveal" style="background:var(--paper);color:var(--ink);">'+lines.map(esc).join("<br>")+'</div>';
      ev.target.style.display="none";
    });
  }

  recordResult(q, isCorrect, yourText, correctText);
  SESSION.answers.push({key:q.key, isCorrect:isCorrect, q:q, yourText:yourText, correctText:correctText});

  var nextBtn = document.getElementById("nextBtn");
  nextBtn.classList.remove("hidden");
  nextBtn.textContent = (SESSION.idx+1 < SESSION.list.length) ? "次へ" : "結果を見る";
  nextBtn.onclick = function(){
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    SESSION.idx++;
    if(SESSION.idx < SESSION.list.length){ go(renderQuestion); }
    else { go(renderResults); }
  };
  if(typeof nextBtn.scrollIntoView === "function"){
    try{ nextBtn.scrollIntoView({behavior:"smooth", block:"nearest"}); }catch(e){}
  }
}

function renderWeakness(){

  }
  html += '<div style="height:8px"></div>';
  html += '<button class="btn block secondary" id="backHome4">ホームに戻る</button>';

  app.innerHTML = html;
  document.getElementById("backHome4").addEventListener("click", function(){ go(renderHome); });

  Array.prototype.forEach.call(app.querySelectorAll("[data-pattern]"), function(btn){
    btn.addEventListener("click", function(){
      var p = btn.getAttribute("data-pattern");

      if(!pool.length){ alert("この条件の問題が見つかりませんでした。"); return; }
      runQuiz(pool, "苦手克服："+p, null);

/* ---------------- FLASHCARDS (単語カード) ---------------- */
function buildFlashcardDeck(){
  var wrong = loadWrong();
  var seen = {};
  var deck = [];
  wrong.forEach(function(w){
    if(!w.hlEn || !w.hlJp) return;
    var dk = w.hlEn+"|"+w.hlJp;
    if(seen[dk]) return;
    seen[dk] = true;
    deck.push({en:w.hlEn, jp:w.hlJp, key:w.key});
  });
  return shuffle(deck);
}

var FLASH = null;
function renderFlashcards(){
  headerStamp.textContent = "単語カード";
  var deck = buildFlashcardDeck();
  if(!deck.length){
    var html = '<div class="empty-note">単語カードにできる問題（大問1・2）が間違いノートにまだありません。</div>';
    html += '<button class="btn block secondary" id="backHome5">ホームに戻る</button>';
    app.innerHTML = html;
    document.getElementById("backHome5").addEventListener("click", function(){ go(renderHome); });
    return;
  }
  FLASH = { deck:deck, idx:0, flipped:false };
  renderFlashcardCard();
}
function renderFlashcardCard(){
  var f = FLASH;
  var card = f.deck[f.idx];
  var html = '<div class="progress-row" style="margin-bottom:12px;">'+
    '<button class="quit-btn" id="flashQuit">✕ 終了</button>'+
    '<div class="progress-track"><div class="progress-fill" style="width:'+Math.round(f.idx/f.deck.length*100)+'%"></div></div>'+
    '<span>'+(f.idx+1)+' / '+f.deck.length+'</span></div>';
  html += '<div class="flash-card" id="flashCard">'+
    '<div class="flash-face">'+(f.flipped? esc(card.jp) : esc(card.en))+'</div>'+
    '<div class="flash-hint">タップして'+(f.flipped?"英語":"意味")+'を見る</div>'+
    '</div>';
  html += '<div class="flash-actions">'+
    '<button class="btn secondary" id="flashKnow">覚えた！</button>'+
    '<button class="btn" id="flashNext">次へ</button>'+
    '</div>';
  app.innerHTML = html;

  document.getElementById("flashQuit").addEventListener("click", function(){ go(renderHome); });
  document.getElementById("flashCard").addEventListener("click", function(){
    FLASH.flipped = !FLASH.flipped;
    renderFlashcardCard();
  });
  document.getElementById("flashNext").addEventListener("click", function(){
    advanceFlash();
  });
  document.getElementById("flashKnow").addEventListener("click", function(){
    removeWrongByKey(card.key);
    advanceFlash();
  });
}
function advanceFlash(){
  FLASH.idx++;
  FLASH.flipped = false;
  if(FLASH.idx >= FLASH.deck.length){
    var html = '<div class="score-hero"><div class="num">🎉</div><div class="sub">単語カードを'+FLASH.deck.length+'枚終えました</div></div>';
    html += '<button class="btn block secondary" id="backHome6">ホームに戻る</button>';
    app.innerHTML = html;
    document.getElementById("backHome6").addEventListener("click", function(){ go(renderHome); });
    return;
  }
  renderFlashcardCard();
}

/* ---------------- GENERIC STUDY DECK (熟語・単語・会話表現) ---------------- */
var DECKS = {
  idiom: {
    title: "重要熟語",
    stamp: "熟語帳",
    data: function(){ return window.IDIOM_DATA; },
    storeKey: "eiken4_idiom_known_v1",
    intro: function(n){ return "英検4級で重要な熟語・連語"+n+"個です。タップして意味と例文を確認し、覚えたらチェックしましょう。"; },
    frontHint: "タップして意味を見る",
    renderFront: function(card){ return esc(card[0]); },
    renderBack: function(card){
      return '<div class="flash-face" style="font-size:19px;">'+esc(card[1])+'</div>'+
        '<div style="font-size:14px;margin-top:10px;">'+esc(card[2])+'</div>'+
        '<div style="font-size:12.5px;color:#AEBBD6;margin-top:4px;">'+esc(card[3])+'</div>';
    },
    hasTiers: false
  },
  word: {
    title: "重要単語",
    stamp: "単語帳",
    data: function(){ return window.WORD_DATA; },
    storeKey: "eiken4_word_known_v1",
    intro: function(n){ return "英検4級で重要な単語"+n+"個（重要度S・A・Bの3段階）です。タップして意味を確認し、覚えたらチェックしましょう。"; },
    frontHint: "タップして意味を見る",
    renderFront: function(card){ return esc(card[0]); },
    renderBack: function(card){
      var tierLabel = {S:"重要度S（最優先）", A:"重要度A", B:"重要度B"}[card[2]] || "";
      return '<div class="flash-face" style="font-size:22px;">'+esc(card[1])+'</div>'+
        '<div style="font-size:12px;color:#AEBBD6;margin-top:10px;">'+esc(tierLabel)+'</div>';
    },
    hasTiers: true
  }
};

function loadDeckKnown(storeKey){
  try{ return JSON.parse(localStorage.getItem(storeKey)) || []; }catch(e){ return []; }
}
function saveDeckKnown(storeKey, arr){
  try{ localStorage.setItem(storeKey, JSON.stringify(arr)); }catch(e){}
}

var STUDYSTATE = null;
function renderDeckPicker(deckKey){
  var cfg = DECKS[deckKey];
  var data = cfg.data();
  headerStamp.textContent = cfg.stamp;
  var known = loadDeckKnown(cfg.storeKey);
  var html = '<div class="card">'+cfg.intro(data.length)+'</div>';

  var mode = "all";
  var tier = "ALL";

  html += '<div class="pill-row" id="deckModePills"><span class="pill on" data-mode="all">すべて（'+data.length+'）</span>'+
    '<span class="pill" data-mode="unknown">未習得のみ（'+(data.length-known.length)+'）</span></div>';

  if(cfg.hasTiers){
    html += '<div class="pill-row" id="deckTierPills">'+
      '<span class="pill on" data-tier="ALL">全レベル</span>'+
      '<span class="pill" data-tier="S">S（最優先）</span>'+
      '<span class="pill" data-tier="A">A</span>'+
      '<span class="pill" data-tier="B">B</span></div>';
  }

  html += '<button class="btn block" id="deckStart">カードを始める</button>';
  html += '<div style="height:8px"></div>';
  html += '<button class="btn block secondary" id="deckBackHome">ホームに戻る</button>';
  app.innerHTML = html;

  Array.prototype.forEach.call(document.querySelectorAll("#deckModePills .pill"), function(p){
    p.addEventListener("click", function(){
      mode = p.getAttribute("data-mode");
      Array.prototype.forEach.call(document.querySelectorAll("#deckModePills .pill"), function(x){ x.classList.remove("on"); });
      p.classList.add("on");
    });
  });
  if(cfg.hasTiers){
    Array.prototype.forEach.call(document.querySelectorAll("#deckTierPills .pill"), function(p){
      p.addEventListener("click", function(){
        tier = p.getAttribute("data-tier");
        Array.prototype.forEach.call(document.querySelectorAll("#deckTierPills .pill"), function(x){ x.classList.remove("on"); });
        p.classList.add("on");
      });
    });
  }
  document.getElementById("deckBackHome").addEventListener("click", function(){ go(renderHome); });
  document.getElementById("deckStart").addEventListener("click", function(){
    var known2 = loadDeckKnown(cfg.storeKey);
    var idxList = data.map(function(_,i){ return i; });
    if(mode==="unknown"){ idxList = idxList.filter(function(i){ return known2.indexOf(i)<0; }); }
    if(cfg.hasTiers && tier!=="ALL"){ idxList = idxList.filter(function(i){ return data[i][2]===tier; }); }
    if(!idxList.length){ alert("対象のカードがありません。条件を変えてみましょう。"); return; }
    STUDYSTATE = { deckKey:deckKey, order: shuffle(idxList), pos:0, flipped:false };
    renderDeckCard();
  });
}
function renderDeckCard(){
  var st = STUDYSTATE;
  var cfg = DECKS[st.deckKey];
  var data = cfg.data();
  var i = st.order[st.pos];
  var card = data[i];
  var known = loadDeckKnown(cfg.storeKey);
  var isKnown = known.indexOf(i)>=0;

  var html = '<div class="progress-row" style="margin-bottom:12px;">'+
    '<button class="quit-btn" id="deckQuit">✕ 終了</button>'+
    '<div class="progress-track"><div class="progress-fill" style="width:'+Math.round(st.pos/st.order.length*100)+'%"></div></div>'+
    '<span>'+(st.pos+1)+' / '+st.order.length+'</span></div>';

  html += '<div class="flash-card" id="deckCard">';
  if(!st.flipped){
    html += '<div class="flash-face">'+cfg.renderFront(card)+'</div><div class="flash-hint">'+cfg.frontHint+'</div>';
  } else {
    html += cfg.renderBack(card);
  }
  html += '</div>';
  html += '<div class="flash-actions">'+
    '<button class="btn secondary" id="deckKnow">'+(isKnown?"習得済み ✓":"覚えた！")+'</button>'+
    '<button class="btn" id="deckNext">次へ</button>'+
    '</div>';
  app.innerHTML = html;

  document.getElementById("deckQuit").addEventListener("click", function(){ go(renderHome); });
  document.getElementById("deckCard").addEventListener("click", function(){
    STUDYSTATE.flipped = !STUDYSTATE.flipped;
    renderDeckCard();
  });
  document.getElementById("deckNext").addEventListener("click", function(){ advanceDeck(); });
  document.getElementById("deckKnow").addEventListener("click", function(){
    var k = loadDeckKnown(cfg.storeKey);
    if(k.indexOf(i)<0){ k.push(i); saveDeckKnown(cfg.storeKey, k); }
    advanceDeck();
  });
}
function advanceDeck(){
  var st = STUDYSTATE;
  var cfg = DECKS[st.deckKey];
  var data = cfg.data();
  st.pos++;
  st.flipped = false;
  if(st.pos >= st.order.length){
    var known = loadDeckKnown(cfg.storeKey);
    var html = '<div class="score-hero"><div class="num">🎉</div><div class="sub">'+cfg.title+'カード '+st.order.length+' 枚終了（習得済み '+known.length+' / '+data.length+'）</div></div>';
    html += '<button class="btn block secondary" id="deckBackHome2">ホームに戻る</button>';
    app.innerHTML = html;
    document.getElementById("deckBackHome2").addEventListener("click", function(){ go(renderHome); });
    return;
  }
  renderDeckCard();
}

/* ---------------- CONVERSATION QUIZ (場面別会話表現) ---------------- */
function startConvQuiz(){
  var list = window.CONV_DATA.map(function(item, i){
    return {
      key: "conv_"+i, examId:"conv", examLabel:"場面別",
      domain:"conv", section:"conv", sectionKey:"CONV", sectionLabel:"会話表現",
      type:"choice", n:i+1, q:item.q, choices:item.choices, a:item.a,
      full:item.full, jp:item.jp, hlEn:item.hlEn, hlJp:item.hlJp,
      point: item.point, pattern:item.pattern,
      promptShort: item.q.replace(/\n/g," / ").slice(0,40)
    };
  });
  runQuiz(shuffle(list), "場面別会話表現", null);
}

/* ---------------- STUDY TIPS (勉強のコツ) ---------------- */
function findWord(en){
  var w = window.WORD_DATA.find(function(x){ return x[0]===en; });
  return w ? w : [en, "", ""];
}
function findIdiom(en){
  var it = window.IDIOM_DATA.find(function(x){ return x[0]===en; });
  return it ? it : [en, "", "", ""];
}

function renderStudyTips(){
  headerStamp.textContent = "勉強のコツ";
  var html = '<div class="card">これまで調べた学習サイトの「効果的な覚え方」を、このアプリの実際の単語・熟語・会話表現を例にまとめました。読むだけでなく、下のボタンからそのまま練習に進めます。</div>';

  // --- 単語 ---
  html += '<div class="section-title"><span class="bar"></span>単語の覚え方</div>';
  html += '<div class="card"><b>① 3段階に仕分ける</b><br>単語カードを見て、「1秒でわかる」「考えればわかる」「わからない」の3つに分け、わからないものだけを集中的に復習します。1秒以上考えて出てくる単語は「わからない」に入れるのがコツです。</div>';
  var wS = findWord("study"), wA = findWord("believe"), wB = findWord("stomachache");
  html += '<div class="card" style="font-size:13.5px;">例：<br>'+
    '1秒でわかる → <b>'+esc(wS[0])+'</b>（'+esc(wS[1])+'）<br>'+
    '考えればわかる → <b>'+esc(wA[0])+'</b>（'+esc(wA[1])+'）<br>'+
    'わからない → <b>'+esc(wB[0])+'</b>（'+esc(wB[1])+'）</div>';
  html += '<div class="card"><b>② 間隔をあけて繰り返す（間隔反復）</b><br>覚えた直後にもう一度確認しても効果は薄く、少し忘れかけた頃に復習するのが効果的です。目安：覚えた日→2日後→4日後→1週間後→2週間後、というように間隔を広げながら繰り返しましょう。</div>';

  // --- 熟語 ---
  html += '<div class="section-title"><span class="bar"></span>熟語の覚え方</div>';
  html += '<div class="card"><b>① 見る→声に出す→書く→テストの4ステップ</b><br>①意味を見て確認 ②声に出して3〜5回読む ③ノートに書き出す ④日本語だけを見て英語が言えるかテストする、の順で進めると定着しやすくなります。</div>';
  var u1 = findIdiom("hurry up"), u2 = findIdiom("give up"), u3 = findIdiom("wake up");
  html += '<div class="card"><b>② 語のイメージでグループ化する</b><br>upには「一番上・限界」というイメージがあります。バラバラに覚えるより、同じイメージの熟語をまとめて覚えると効率的です。<br><br>'+
    '<b>'+esc(u1[0])+'</b>（'+esc(u1[1])+'）→ スピードを最大まで上げる<br>'+
    '<b>'+esc(u2[0])+'</b>（'+esc(u2[1])+'）→ 限界がきて手放す<br>'+
    '<b>'+esc(u3[0])+'</b>（'+esc(u3[1])+'）→ 眠りから意識が浮き上がる</div>';
  var ex1 = findIdiom("be good at");
  html += '<div class="card"><b>③ 例文とセットで覚える</b><br>意味だけでなく、「誰がどんな場面で使うか」を例文でイメージすると記憶に残りやすくなります。<br><br>'+
    '<b>'+esc(ex1[0])+'</b>（'+esc(ex1[1])+'）<br>'+
    '<span style="color:var(--ink-soft);">'+esc(ex1[2])+'<br>'+esc(ex1[3])+'</span></div>';

  // --- 会話表現 ---
  html += '<div class="section-title"><span class="bar"></span>会話表現の覚え方</div>';
  var c1 = window.CONV_DATA[6]; // Could you close the door?
  html += '<div class="card"><b>① 「問いかけ」と「応答」をペアで覚える</b><br>単語ではなく、やり取りのセットで覚えると本番でもすぐ答えを選べます。<br><br>'+
    '<span style="color:var(--accent);font-weight:700;">'+esc(c1.q.split("\\n")[0])+'</span><br>→ '+esc(c1.choices[c1.a])+'</div>';
  html += '<div class="card"><b>② 場面ごとにまとめる</b><br>買い物・電話・道案内・レストラン・体調など、使う場面ごとに整理すると忘れにくくなります。このアプリの「場面別会話表現」も、この8つの場面で分類しています：許可を求める／依頼する／勧誘・申し出／買い物／電話／道案内／レストラン／体調・気づかい</div>';
  html += '<div class="card"><b>③ ていねいさの違いを意識する</b><br>Can you 〜? より Could you 〜? の方がていねいな言い方です。場面によってどちらが自然か考えながら覚えましょう。</div>';

  // --- common ---
  html += '<div class="section-title"><span class="bar"></span>共通のコツ</div>';
  html += '<div class="card">・完璧を目指さず、短時間でも毎日繰り返すほうが定着します。<br>・声に出す（音読）ことは、どのサイトでも効果的な方法として紹介されていました。リスニング力にもつながります。</div>';

  html += '<div class="section-title"><span class="bar"></span>さっそく練習する</div>';
  html += '<button class="btn block secondary" id="tipsGoWord">重要単語で覚える</button><div style="height:8px"></div>';
  html += '<button class="btn block secondary" id="tipsGoIdiom">重要熟語で覚える</button><div style="height:8px"></div>';
  html += '<button class="btn block secondary" id="tipsGoConv">場面別会話表現に挑戦</button><div style="height:8px"></div>';
  html += '<button class="btn block secondary" id="tipsBackHome">ホームに戻る</button>';

  app.innerHTML = html;
  document.getElementById("tipsGoWord").addEventListener("click", function(){ go(function(){ renderDeckPicker("word"); }); });
  document.getElementById("tipsGoIdiom").addEventListener("click", function(){ go(function(){ renderDeckPicker("idiom"); }); });
  document.getElementById("tipsGoConv").addEventListener("click", function(){ go(renderConvIntro); });
  document.getElementById("tipsBackHome").addEventListener("click", function(){ go(renderHome); });
}

function renderConvIntro(){
  headerStamp.textContent = "会話表現";
  var html = '<div class="card">買い物・電話・道案内・許可・依頼など、場面別の会話表現を4択形式で練習します（全'+window.CONV_DATA.length+'問）。問いかけに対して最も適切な応答を選びましょう。</div>';
  html += '<button class="btn block" id="convStart">この問題を始める</button>';
  html += '<div style="height:8px"></div>';
  html += '<button class="btn block secondary" id="convBackHome">ホームに戻る</button>';

  document.getElementById("convBackHome").addEventListener("click", function(){ go(renderHome); });
  document.getElementById("convStart").addEventListener("click", function(){ startConvQuiz(); });
}

/* ---------------- STATS ---------------- */
function renderStats(){
  headerStamp.textContent = "学習状況";
  var stats = loadStats();
  var wrong = loadWrong();

  var html = '<div class="section-title"><span class="bar"></span>大問別 正答率</div><div class="card">';
  ALL_SECTION_KEYS.forEach(function(sk){
    var s = stats[sk];
    var label = sk==="CONV" ? "場面別会話表現" : (sk[0]==="R" ? R_LABELS["part"+sk.slice(1)] : L_LABELS["part"+sk.slice(1)]);
    if(!s || !s.attempts){
      html += '<div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-soft);"><span>'+esc(label)+'</span><span>未挑戦</span></div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:0%"></div></div></div>';
    } else {
      var p = Math.round(s.correct/s.attempts*100);
      html += '<div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:13.5px;"><span>'+esc(label)+'</span><span>'+s.correct+'/'+s.attempts+'（'+p+'%）</span></div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+p+'%;background:'+(p<60?"var(--bad)":p<80?"var(--gold)":"var(--good)")+';"></div></div></div>';
    }
  });
  html += '</div>';

  html += '<div class="section-title"><span class="bar"></span>間違いノート（'+wrong.length+'問）</div>';
  if(!wrong.length){
    html += '<div class="empty-note">まだ記録がありません。演習を始めましょう。</div>';
  } else {
    html += '<div class="card">';
    wrong.slice(0,80).forEach(function(w){
      html += '<div class="review-row"><span>'+esc(w.examLabel)+' ・ '+esc(w.sectionLabel)+' No.'+w.n+'<br><span style="color:var(--ink-soft);font-size:12px;">'+esc(w.promptShort)+'</span></span>'+
        '<span style="text-align:right;font-size:13px;">正解: '+esc(w.correctText)+'</span></div>';
    });
    html += '</div>';
  }

  html += '<div style="height:6px"></div>';
  html += '<button class="btn block secondary" id="resetStats">記録をすべてリセットする</button>';
  html += '<div style="height:8px"></div>';
  html += '<button class="btn block secondary" id="backHome3">ホームに戻る</button>';

  app.innerHTML = html;
  document.getElementById("backHome3").addEventListener("click", function(){ go(renderHome); });
  document.getElementById("resetStats").addEventListener("click", function(){
    if(confirm("正答率の記録と間違いノートをすべて削除します。よろしいですか？")){
      localStorage.removeItem(STORE_STATS);
      localStorage.removeItem(STORE_WRONG);
      go(renderStats);
    }
  });
}

/* ---------------- init ---------------- */
go(renderHome);

})();
